<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片去背景工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; min-height: 100vh;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 860px;
    height: fit-content;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }

  /* ---------- 首次使用提醒卡片 ---------- */
  #modelNotice {
    display: none; margin-bottom: 20px; padding: 14px 16px;
    background: #fffbe6; border: 1px solid #ffe58f; border-radius: 10px;
    font-size: 13px; color: #614700; line-height: 1.8;
    position: relative;
  }
  #modelNotice b { color: #d46b08; }
  #modelNotice .close {
    position: absolute; top: 8px; right: 12px; cursor: pointer;
    color: #999; font-size: 16px; border: none; background: none;
  }
  #modelNotice ul { margin: 4px 0 0 18px; }
  #modelNotice li { margin: 2px 0; }

  /* ---------- 上传区 ---------- */
  #dropzone {
    border: 2px dashed #c8ccd4; border-radius: 12px;
    padding: 48px 20px; text-align: center; cursor: pointer;
    transition: all .2s; color: #666;
  }
  #dropzone:hover, #dropzone.dragover {
    border-color: #4a7dff; background: #f5f8ff; color: #4a7dff;
  }
  #dropzone.disabled { pointer-events: none; opacity: .5; cursor: not-allowed; }
  #dropzone .icon { font-size: 40px; margin-bottom: 12px; }
  #fileInput { display: none; }

  /* ---------- 进度条 ---------- */
  #progressArea { display: none; margin-top: 24px; }
  #progressLabel { font-size: 14px; color: #555; margin-bottom: 8px; }
  .track {
    height: 8px; border-radius: 4px; background: #e8eaee; overflow: hidden;
  }
  .bar {
    height: 100%; width: 0%; background: linear-gradient(90deg,#4a7dff,#7aa2ff);
    border-radius: 4px; transition: width .2s;
  }
  /* total 为 0 时：不确定进度动画（来回滚动） */
  .bar.indeterminate {
    width: 40% !important;
    animation: slide 1.2s ease-in-out infinite alternate;
  }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 60% } }
  .hint { font-size: 12px; color: #aaa; margin-top: 8px; }

  /* ---------- 结果区 ---------- */
  #resultArea { display: none; margin-top: 24px; }

  /* 对比滑块容器 */
  #compare {
    position: relative; width: 100%; user-select: none;
    touch-action: none; /* 关键：禁止浏览器默认手势，否则拖动会被页面滚动打断 */
    overflow: hidden; border-radius: 12px; border: 1px solid #e5e7eb;
  }
  #compare img { display: block; width: 100%; pointer-events: none; }

  /* 上层原图：用 clip-path 只露分割线左侧 */
  #clipLayer { position: absolute; inset: 0; }

  /* 结果层背景：透明时显示棋盘格，选色后由 JS 覆盖为纯色 */
  #checker {
    position: absolute; inset: 0; z-index: -1;
    background: repeating-conic-gradient(#e6e6e6 0% 25%, #ffffff 0% 50%);
    background-size: 20px 20px;
  }

  #line {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
    background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.4);
  }
  #handle {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    cursor: ew-resize; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #555; outline: none;
  }
  #handle:focus-visible { box-shadow: 0 0 0 3px #4a7dff66; }

  .tag {
    position: absolute; top: 10px; font-size: 12px; color: #fff;
    background: rgba(0,0,0,.45); padding: 3px 10px; border-radius: 4px;
    pointer-events: none;
  }
  .tag-l { left: 10px; } .tag-r { right: 10px; }

  /* 工具栏 */
  #toolbar { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button, select, input[type=color] {
    height: 36px; border-radius: 8px; border: 1px solid #d5d9e0;
    padding: 0 14px; font-size: 14px; background: #fff; cursor: pointer;
  }
  #btnDownload { background: #4a7dff; border-color: #4a7dff; color: #fff; }
  #btnDownload:hover { background: #3a6bef; }
  #btnReset { }
  label.ck { font-size: 14px; color: #555; display: flex; gap: 6px; align-items: center; }

  /* 错误提示条 */
  #errorBar {
    display: none; margin-top: 16px; padding: 12px 16px;
    background: #fff1f0; border: 1px solid #ffa39e; border-radius: 8px;
    color: #cf1322; font-size: 14px; align-items: center; gap: 12px;
  }
  #btnRetry { height: 30px; padding: 0 12px; background: #cf1322; color: #fff; border: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🖼️ 图片去背景工具</h1>
  <p class="sub">纯浏览器本地处理 · 图片不上传服务器 · 首次使用需下载模型（约 80MB，之后缓存秒开）</p>

  <!-- 首次使用提醒：模型下载说明 -->
  <div id="modelNotice">
    <button class="close" id="noticeClose" aria-label="关闭提醒">✕</button>
    <b>⏳ 首次使用说明</b>
    <ul>
      <li>首次使用需下载 AI 模型（<b>约 80MB</b>），视网络情况需要几分钟，请耐心等待</li>
      <li>模型会<b>缓存在浏览器</b>中，之后使用<b>无需再下载，秒开</b></li>
      <li>注意：清除浏览器缓存 / 使用无痕模式 / 更换浏览器，会<b>重新下载</b>模型</li>
    </ul>
  </div>

  <div id="dropzone">
    <div class="icon">📁</div>
    <p><b>拖拽图片到这里</b>，或点击选择文件</p>
    <p style="font-size:12px;margin-top:8px;color:#999">支持 JPG / PNG / WebP，单张不超过 20MB</p>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">

  <div id="progressArea">
    <div id="progressLabel">准备中…</div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="hint" id="progressHint">模型时长取决于设备性能，CPU 上约 5~15 秒</div>
  </div>

  <div id="errorBar">
    <span id="errorText"></span>
    <button id="btnRetry">重试</button>
  </div>

  <div id="resultArea">
    <div id="compare">
      <div id="checker"></div>
      <!-- 底层：抠图结果（右半边露出来） -->
      <img id="imgResult" alt="抠图结果">
      <!-- 上层：原图，clip-path 只露左侧 -->
      <div id="clipLayer" style="clip-path: inset(0 50% 0 0)">
        <img id="imgOrigin" alt="原图">
      </div>
      <div id="line">
        <div id="handle" tabindex="0" role="slider" aria-label="对比滑块"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">↔</div>
      </div>
      <span class="tag tag-l">原图</span>
      <span class="tag tag-r">抠图结果</span>
    </div>

    <div id="toolbar">
      <button id="btnDownload">⬇ 下载 PNG</button>
      <label class="ck">换背景色：
        <select id="bgSelect">
          <option value="transparent">透明（棋盘格）</option>
          <option value="#ffffff">白色</option>
          <option value="#000000">黑色</option>
          <option value="custom">自定义…</option>
        </select>
      </label>
      <input type="color" id="bgColor" value="#ffdd57" style="display:none">
      <button id="btnReset">↺ 换一张</button>
    </div>
  </div>
</div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

const $ = id => document.getElementById(id);
const els = {
  dropzone: $('dropzone'), fileInput: $('fileInput'),
  progressArea: $('progressArea'), progressLabel: $('progressLabel'),
  bar: $('bar'), progressHint: $('progressHint'),
  errorBar: $('errorBar'), errorText: $('errorText'), btnRetry: $('btnRetry'),
  resultArea: $('resultArea'), compare: $('compare'),
  imgOrigin: $('imgOrigin'), imgResult: $('imgResult'),
  clipLayer: $('clipLayer'), line: $('line'), handle: $('handle'),
  checker: $('checker'),
  btnDownload: $('btnDownload'), btnReset: $('btnReset'),
  bgSelect: $('bgSelect'), bgColor: $('bgColor'),
};

const state = {
  file: null,
  originURL: null,
  resultURL: null,
  resultBlob: null,
  busy: false,
  firstFetchDone: false,   // 第一次 fetch 阶段完成后 = 模型已缓存
};

/* ============ 首次使用提醒(localStorage 记忆,点过关闭就不再弹) ============ */
const NOTICE_KEY = 'bg-removal-notice-dismissed';
const noticeEl = document.getElementById('modelNotice');
const noticeClose = document.getElementById('noticeClose');

// 没点过关闭就显示;想每次访问都显示,把 if 条件删掉、只留下一行 display = 'block'
if (!localStorage.getItem(NOTICE_KEY)) noticeEl.style.display = 'block';

noticeClose.addEventListener('click', () => {
  noticeEl.style.display = 'none';
  localStorage.setItem(NOTICE_KEY, '1');
});

/* ================= 上传 ================= */

els.dropzone.addEventListener('click', () => els.fileInput.click());
els.fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
  e.target.value = '';
});

['dragover', 'dragenter'].forEach(ev =>
  els.dropzone.addEventListener(ev, e => { e.preventDefault(); els.dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev =>
  els.dropzone.addEventListener(ev, e => { e.preventDefault(); els.dropzone.classList.remove('dragover'); }));
els.dropzone.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

function handleFile(file) {
  // 上传前校验
  const okTypes = ['image/jpeg', 'image/png', 'image/webp'];
  if (!okTypes.includes(file.type)) return showError('仅支持 JPG / PNG / WebP 格式');
  if (file.size > 20 * 1024 * 1024) return showError('文件超过 20MB 上限');

  hideError();
  state.file = file;
  process(file);
}

/* ================= 核心处理 ================= */

async function process(file) {
  state.busy = true;
  setDropzoneEnabled(false);
  showProgress();

  try {
    let lastLabel = '';
    const blob = await removeBackground(file, {
      model: 'medium',
      output: { format: 'image/png' },
      // 分阶段进度：key 以 fetch 开头是下载/加载模型，以 compute 开头是推理
      progress: (key, current, total) => {
        let label;
        if (key.startsWith('fetch')) {
          label = state.firstFetchDone
            ? '正在加载资源…'
            : `正在下载模型（仅首次）… ${formatMB(total)}`;
        } else if (key.startsWith('compute')) {
          label = '正在抠图…';
        } else {
          label = '处理中…';
        }
        if (label !== lastLabel) { lastLabel = label; setProgressText(label); }

        const pct = total ? Math.round(current / total * 100) : null;
        setProgressBar(pct);
        if (key.startsWith('fetch') && total && current >= total) {
          state.firstFetchDone = true; // 模型已进缓存，下次秒开
        }
      },
    });

    state.resultBlob = blob;
    render(file, blob);
  } catch (err) {
    console.error(err);
    hideProgress();
    showError('抠图失败：' + (err?.message || '未知错误（可能是模型下载失败，请检查网络）'), true);
  } finally {
    state.busy = false;
    setDropzoneEnabled(true);
  }
}

function render(file, blob) {
  releaseURLs();
  state.originURL = URL.createObjectURL(file);
  state.resultURL = URL.createObjectURL(blob);

  els.imgOrigin.src = state.originURL;
  els.imgResult.src = state.resultURL;
  els.checker.style.background = ''; // 恢复棋盘格

  hideProgress();
  els.resultArea.style.display = 'block';
  setSlider(50);
}

function releaseURLs() {
  if (state.originURL) URL.revokeObjectURL(state.originURL);
  if (state.resultURL) URL.revokeObjectURL(state.resultURL);
  state.originURL = state.resultURL = null;
}

/* ================= 对比滑块（Pointer Events） ================= */

function setSlider(pct) {
  pct = Math.min(100, Math.max(0, pct));
  // clip-path 四值顺序：top right bottom left
  // 第二个值 = 右侧裁掉 (100-pct)%，即左侧露出原图到 pct 位置
  els.clipLayer.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
  els.line.style.left = pct + '%';
  els.handle.setAttribute('aria-valuenow', Math.round(pct));
}

let dragging = false;
els.compare.addEventListener('pointerdown', e => {
  dragging = true;
  els.compare.setPointerCapture(e.pointerId); // 拖出容器也能继续跟踪
  moveTo(e);
});
els.compare.addEventListener('pointermove', e => { if (dragging) moveTo(e); });
els.compare.addEventListener('pointerup', () => dragging = false);
els.compare.addEventListener('pointercancel', () => dragging = false);

function moveTo(e) {
  const rect = els.compare.getBoundingClientRect();
  setSlider((e.clientX - rect.left) / rect.width * 100);
}

// 键盘微调：聚焦手柄后按 ←/→，配合 Shift 大步调
els.handle.addEventListener('keydown', e => {
  const step = e.shiftKey ? 10 : 2;
  if (e.key === 'ArrowLeft')  { setSlider(parseFloat(els.line.style.left) - step); e.preventDefault(); }
  if (e.key === 'ArrowRight') { setSlider(parseFloat(els.line.style.left) + step); e.preventDefault(); }
});

/* ================= 换背景色 + 下载 ================= */

els.bgSelect.addEventListener('change', () => {
  const v = els.bgSelect.value;
  els.bgColor.style.display = v === 'custom' ? 'inline-block' : 'none';
  applyBg(v === 'custom' ? els.bgColor.value : v);
});
els.bgColor.addEventListener('input', () => applyBg(els.bgColor.value));

function applyBg(color) {
  // 透明 → 恢复棋盘格；纯色 → 直接覆盖容器背景（预览零成本）
  els.checker.style.background = color === 'transparent' ? '' : color;
}

els.btnDownload.addEventListener('click', async () => {
  if (!state.resultBlob) return;
  const color = els.bgSelect.value;

  if (color === 'transparent') {
    downloadBlob(state.resultBlob, 'nobg.png');
    return;
  }
  // 纯色背景：Canvas 合成（先铺色再画图，保住透明通道的正确叠加）
  const img = els.imgResult;
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color === 'custom' ? els.bgColor.value : color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  canvas.toBlob(b => downloadBlob(b, 'nobg-colored.png'), 'image/png');
});

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= 重置 / 重试 ================= */

els.btnReset.addEventListener('click', () => {
  releaseURLs();
  state.file = null;
  els.resultArea.style.display = 'none';
  hideError();
});

els.btnRetry.addEventListener('click', () => {
  hideError();
  if (state.file) process(state.file);
});

/* ================= UI 小工具 ================= */

function setDropzoneEnabled(on) {
  els.dropzone.classList.toggle('disabled', !on);
}
function showProgress() {
  els.progressArea.style.display = 'block';
  els.resultArea.style.display = 'none';
  setProgressBar(null);
  setProgressText('准备中…');
}
function hideProgress() { els.progressArea.style.display = 'none'; }
function setProgressText(t) { els.progressLabel.textContent = t; }
function setProgressBar(pct) {
  if (pct === null) { // 无进度信息 → 不确定动画
    els.bar.classList.add('indeterminate');
  } else {
    els.bar.classList.remove('indeterminate');
    els.bar.style.width = pct + '%';
  }
}
function showError(msg, withRetry = false) {
  els.errorText.textContent = msg;
  els.btnRetry.style.display = withRetry ? 'inline-block' : 'none';
  els.errorBar.style.display = 'flex';
}
function hideError() { els.errorBar.style.display = 'none'; }
function formatMB(bytes) {
  return bytes ? `约 ${(bytes / 1024 / 1024).toFixed(0)}MB` : '';
}
</script>
</body>
</html>
