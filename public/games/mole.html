<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>打地鼠 · zlToT 小游戏</title>
<style>
  .title-bar {
    text-align: center;
    width: 100%;
    max-width: 560px;
    margin-bottom: 18px;
  }
  h1 { font-size: 26px; font-weight: 800; color: #e6ede9; }
  .hud { display: flex; gap: 14px; justify-content: center; margin-bottom: 16px; }
  .hud-item {
    background: rgba(15,25,32,0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    min-width: 100px;
  }
  .hud-label { font-size: 12px; color: #809aa8; }
  .hud-value { font-size: 20px; font-weight: 800; color: #e6ede9; }
  .field {
    position: relative;
    background: rgba(15,25,32,0.6);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 560px;
  }
  .holes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .hole {
    position: relative;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 50% 78%, #14532d 0%, #166534 40%, #57b68c 90%);
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hole::after {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: -14%;
    height: 34%;
    border-radius: 50%;
    background: #052e16;
    box-shadow: inset 0 6px 12px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .mole {
    position: absolute;
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%) translateY(130%);
    width: 58%;
    height: 58%;
    z-index: 2;
    transition: transform 0.18s ease-out;
    pointer-events: none;
  }
  .hole.up .mole {
    transform: translateX(-50%) translateY(0);
  }
  .mole-body {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 78%;
    height: 72%;
    border-radius: 48% 48% 46% 46%;
    background: linear-gradient(160deg, #d97706, #92400e);
    box-shadow: inset -6px -6px 10px rgba(0,0,0,0.18);
  }
  .mole-ear-l, .mole-ear-r {
    position: absolute;
    bottom: 52%;
    width: 22%;
    height: 34%;
    border-radius: 50%;
    background: linear-gradient(160deg, #f59e0b, #b45309);
  }
  .mole-ear-l { left: 6%; }
  .mole-ear-r { right: 6%; }
  .mole-eye-l, .mole-eye-r {
    position: absolute;
    bottom: 46%;
    width: 9%;
    height: 12%;
    border-radius: 50%;
    background: #1c1917;
  }
  .mole-eye-l { left: 24%; }
  .mole-eye-r { right: 24%; }
  .mole-nose {
    position: absolute;
    bottom: 36%;
    left: 50%;
    transform: translateX(-50%);
    width: 18%;
    height: 13%;
    border-radius: 50%;
    background: #7c2d12;
  }
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: rgba(10, 15, 12, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; font-weight: 800; color: #e6ede9; }
  .overlay p { color: #aad0e6; font-size: 15px; }
  .btn {
    padding: 12px 26px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #1a1c2c;
    background: #facc15;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .tip { margin-top: 16px; font-size: 13px; color: #809aa8; text-align: center; }
  /* 打中特效 */
  .fx {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    font-size: 34px;
    z-index: 4;
    pointer-events: none;
    animation: fxPop .45s ease-out forwards;
  }
  @keyframes fxPop {
    0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(0.6); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(1.4); }
  }
  /* 背景：小老鼠走来走去 */
  #bgMoles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #bgMoles span {
    position: absolute;
    font-size: 42px;
    opacity: .22;
    animation: moleWalk linear infinite;
  }
  @keyframes moleWalk {
    0% { transform: translateX(-6vw) scaleX(1); }
    48% { transform: translateX(96vw) scaleX(1); }
    50% { transform: translateX(96vw) scaleX(-1); }
    98% { transform: translateX(-6vw) scaleX(-1); }
    100% { transform: translateX(-6vw) scaleX(1); }
  }
</style>
</head>
<body>
  <div id="bgMoles" aria-hidden="true">
    <span style="bottom:12px;animation-duration:22s;animation-delay:0s">🐹</span>
    <span style="bottom:76px;animation-duration:30s;animation-delay:-9s">🐹</span>
    <span style="bottom:138px;animation-duration:26s;animation-delay:-17s">🐹</span>
    <span style="bottom:205px;animation-duration:34s;animation-delay:-5s">🐹</span>
  </div>

  <div class="title-bar">
    <h1>🔨 打地鼠</h1>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="hud-label">🏆 得分</div><div class="hud-value" id="score">0</div></div>
    <div class="hud-item"><div class="hud-label">⏱ 剩余时间</div><div class="hud-value" id="time">30s</div></div>
    <div class="hud-item"><div class="hud-label">💎 最高分</div><div class="hud-value" id="best">0</div></div>
  </div>

  <div class="field" id="field">
    <div class="holes" id="holes"></div>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">🐹 打地鼠</h2>
      <p id="ov-desc">地鼠冒出时点击它！限时 30 秒，看看你能得多少分。</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <p class="tip">点得越快，分数越高</p>

<script type="module">
  import { initGamePage } from './game-utils.js';
  initGamePage({ emojis: ['🐹', '🔨', '🌱', '⛰️'] });

(function () {
  var holesEl = document.getElementById('holes');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovDesc = document.getElementById('ov-desc');
  var startBtn = document.getElementById('startBtn');

  var best = localStorage.getItem('mole-best');
  bestEl.textContent = best ? best : '0';

  var score = 0;
  var timeLeft = 30;
  var timerId = null;
  var spawnTimer = null;
  var playing = false;
  var HOLES = 9;

  // 建 9 个洞（3x3），地鼠用 CSS 动画出没
  var holes = [];
  for (var i = 0; i < HOLES; i++) {
    var hole = document.createElement('div');
    hole.className = 'hole';
    hole.innerHTML =
      '<div class="mole">' +
        '<div class="mole-ear-l"></div>' +
        '<div class="mole-ear-r"></div>' +
        '<div class="mole-eye-l"></div>' +
        '<div class="mole-eye-r"></div>' +
        '<div class="mole-nose"></div>' +
        '<div class="mole-body"></div>' +
      '</div>';
    hole.addEventListener('click', hit);
    holesEl.appendChild(hole);
    holes.push(hole);
  }

  function hit(e) {
    var hole = e.currentTarget;
    if (!playing) return;
    if (hole.classList.contains('up')) {
      score++;
      scoreEl.textContent = score;
      hole.classList.remove('up');
      if (window.SFX) window.SFX.hit();
      // 打中特效 💥
      var fx = document.createElement('span');
      fx.className = 'fx';
      fx.textContent = '💥';
      hole.appendChild(fx);
      setTimeout(function () {
        if (fx.parentNode) fx.parentNode.removeChild(fx);
      }, 500);
    }
  }

  function spawn() {
    if (!playing) return;
    // 先缩回所有地鼠，再随机 1~3 只冒出（有随机性）
    holes.forEach(function (h) { h.classList.remove('up'); });
    var n = 1 + Math.floor(Math.random() * 3);
    var idx = [];
    while (idx.length < n) {
      var r = Math.floor(Math.random() * HOLES);
      if (idx.indexOf(r) === -1) idx.push(r);
    }
    idx.forEach(function (j) { holes[j].classList.add('up'); });
    setTimeout(function () {
      idx.forEach(function (j) { holes[j].classList.remove('up'); });
    }, 700 + Math.random() * 500);
  }

  function tick() {
    timeLeft--;
    timeEl.textContent = timeLeft + 's';
    if (timeLeft <= 0) end();
  }

  function start() {
    score = 0;
    timeLeft = 30;
    scoreEl.textContent = '0';
    timeEl.textContent = '30s';
    playing = true;
    overlay.classList.add('hidden');
    clearInterval(timerId);
    clearInterval(spawnTimer);
    timerId = setInterval(tick, 1000);
    spawnTimer = setInterval(spawn, 900);
    spawn();
  }

  function end() {
    playing = false;
    clearInterval(timerId);
    clearInterval(spawnTimer);
    holes.forEach(function (h) { h.classList.remove('up'); });
    if (window.SFX) window.SFX.over();
    ovTitle.textContent = '⏰ 时间到！';
    ovDesc.textContent = '你打中了 ' + score + ' 只地鼠';
    if (!best || score > Number(best)) {
      best = String(score);
      localStorage.setItem('mole-best', best);
      bestEl.textContent = best;
      ovDesc.textContent += '，刷新纪录！';
    }
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', start);
})();
</script>

<script src="common.js"></script>
</body>
</html>
