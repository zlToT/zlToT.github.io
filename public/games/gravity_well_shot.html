<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>幸存者 · 脉冲</title>
    
    <style>
* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #06070d;
      color: #cfe3f7;
      font-family: "Bahnschrift", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }

    #c,
    #fx {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
      touch-action: none;
    }

    #c {
      z-index: 1;
    }

    #fx {
      z-index: 2;
      pointer-events: none;
    }

    /* ===== 顶部 HUD ===== */
    #timer {
      font-size: 21px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px rgba(90, 200, 255, .6);
    }

    /* ===== Boss 血条 ===== */
    #bossWrap {
      position: fixed;
      z-index: 10;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 62vw);
      display: none;
      pointer-events: none;
    }

    #bossName {
      text-align: center;
      font-size: 11px;
      letter-spacing: 4px;
      color: #ff9ab3;
      margin-bottom: 3px;
      text-shadow: 0 0 8px rgba(255, 60, 110, .7);
    }

    #bossTrack {
      height: 9px;
      border-radius: 5px;
      background: rgba(255, 80, 120, .12);
      border: 1px solid rgba(255, 90, 130, .45);
      overflow: hidden;
    }

    #bossFill {
      height: 100%;
      width: 100%;
      background: #ff5b7f;
      box-shadow: 0 0 14px rgba(255, 91, 127, .8);
    }

    #wpnbar {
      display: flex;
      gap: 6px;
    }

    #wpnbar div {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(20, 34, 54, .78);
      border: 1px solid rgba(110, 170, 230, .32);
      color: #b9d4ec;
    }

    #wpnbar div svg {
      width: 22px;
      height: 22px;
    }

    /* 进化武器：颜色不变，左下角加彩色 ★，右下角照常显示等级 */
    #wpnbar div .sv {
      position: absolute;
      left: 2px;
      bottom: -1px;
      font-size: 10px;
      font-style: normal;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, #ff5f6d, #ffc371, #7ef7c8, #4fc3ff, #b18cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 4px rgba(255, 200, 150, .8));
      pointer-events: none;
    }

    #wpnbar div em {
      position: absolute;
      right: 2px;
      bottom: -1px;
      font-size: 10px;
      font-style: normal;
      font-weight: 700;
      color: inherit;
      opacity: .92;
      text-shadow: 0 0 6px rgba(0, 0, 0, .9);
    }

    /* ===== 局内 HUD：左上状态卡 ===== */
    #hudL {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      width: 306px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(10, 18, 32, .55);
      border: 1px solid rgba(110, 170, 230, .16);
      pointer-events: none;
    }

    #hudL .hrow {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      font-size: 11px;
      letter-spacing: 1px;
      color: #91a9c1;
    }

    #hudL .hrow > span {
      width: 26px;
      flex: none;
    }

    #hudL .track {
      position: relative;
      flex: 1 1 auto;
      min-width: 60px;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
    }

    #hudL .track > i {
      display: block;
      height: 100%;
      width: 100%;
      border-radius: 4px;
      transition: width .1s linear;
    }

    #hudL .track > i.hp {
      background: linear-gradient(90deg, #ff4f76, #ff97ae);
      box-shadow: 0 0 10px rgba(255, 79, 118, .6);
    }

    #hudL .track > i.dash {
      background: linear-gradient(90deg, #36b6ff, #7ee6ff);
      box-shadow: 0 0 10px rgba(54, 182, 255, .55);
    }

    #hudL .track > i.xp {
      background: linear-gradient(90deg, #9a63ff, #c9a7ff);
      box-shadow: 0 0 10px rgba(154, 99, 255, .55);
    }

    #hudL .hrow > b {
      flex: none;
      min-width: 62px;
      text-align: right;
      font-size: 11.5px;
      font-weight: 700;
      color: #dceaf8;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 顶部中央计时 ===== */
    #hudT {
      position: fixed;
      z-index: 10;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    #hudT #timer {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(90, 200, 255, .6);
    }

    #stageTxt {
      margin-top: 1px;
      font-size: 11px;
      letter-spacing: 3px;
      color: #8fb6d8;
    }

    /* ===== 左侧武器 / 强化 ===== */
    #hudW {
      position: fixed;
      z-index: 10;
      left: 12px;
      top: 136px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: none;
    }

    #hudW .lt {
      font-size: 11px;
      letter-spacing: 2px;
      color: #8098b0;
    }

    #hudW .lt b {
      color: #d6e8fa;
      font-weight: 700;
    }

    #pasbar {
      display: flex;
      gap: 6px;
    }

    #pasbar div {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(20, 34, 54, .72);
      border: 1px solid rgba(110, 170, 230, .26);
      color: #b9d4ec;
    }

    #pasbar div svg {
      width: 18px;
      height: 18px;
    }

    #pasbar div em {
      position: absolute;
      right: 1px;
      bottom: -2px;
      font-size: 9px;
      font-style: normal;
      font-weight: 700;
      color: inherit;
      opacity: .92;
      text-shadow: 0 0 6px #000;
    }

    #sklbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 190px;
    }

    #sklbar div {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(20, 34, 54, .72);
      border: 1px solid rgba(110, 170, 230, .26);
      color: #9fe8ff;
    }

    #sklbar div.mount {
      border-style: dashed;
      border-width: 1px;
    }

    /* 专属技能但当前没持有对应武器：不触发，图标压暗 */
    #sklbar div.other {
      opacity: .42;
      filter: grayscale(.45);
    }

    #sklbar div svg {
      width: 18px;
      height: 18px;
    }

    #sklbar div em {
      position: absolute;
      right: 1px;
      bottom: -2px;
      font-size: 9px;
      font-style: normal;
      font-weight: 700;
      color: inherit;
      opacity: .92;
      text-shadow: 0 0 6px #000;
    }

    /* ===== 右上小地图 ===== */    #minimap {
      position: fixed;
      z-index: 10;
      top: 56px;
      right: 12px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 24px rgba(26, 84, 150, .5);
    }

    #mm {
      display: block;
      width: 88px;
      height: 88px;
      border-radius: 50%;
    }

    /* ===== 右下统计 ===== */
    #hudBR {
      position: fixed;
      z-index: 10;
      right: 12px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
    }

    #hudBR .brrow {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #93aabf;
    }

    #hudBR .brrow b {
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    #hudBR .brrow b#killTxt {
      color: #ffd3de;
    }

    #hudBR .brrow b#coinTxt {
      color: #ffd76a;
    }

    #hudBR .brrow i {
      width: 1px;
      height: 11px;
      background: rgba(140, 190, 240, .3);
    }

    #dmgChip {
      font-size: 10.5px;
      letter-spacing: 1px;
      color: #7d95ad;
      background: rgba(12, 22, 38, .58);
      border: 1px solid rgba(110, 170, 230, .16);
      border-radius: 7px;
      padding: 3px 8px;
    }

    /* ===== 虚拟摇杆 ===== */
    #joy {
      position: fixed;
      z-index: 9;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid rgba(130, 200, 255, .32);
      background: radial-gradient(circle, rgba(80, 160, 255, .1), transparent 70%);
      display: none;
      margin: -58px 0 0 -58px;
    }

    #joy i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(120, 210, 255, .5);
      box-shadow: 0 0 20px rgba(120, 210, 255, .85);
    }

    /* ===== 图标按钮 ===== */
    .icon-btn {
      position: fixed;
      z-index: 20;
      top: 10px;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(120, 180, 240, .26);
      background: rgba(16, 26, 42, .74);
      color: #a9c8e4;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
      transition: .15s;
    }

    .icon-btn:hover {
      background: rgba(32, 56, 92, .92);
      color: #dff;
    }

    #pauseBtn {
      right: 10px;
    }

    /* ===== 遮罩面板 ===== */
    #overlay {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 42%, rgba(8, 20, 40, .88), rgba(3, 5, 12, .97));
    }

    /* 标题页 / 局外强化：纯色菜单底，不出现任何网格 */
    #overlay.ttl,
    #overlay.shop {
      background-color: #06070d;
      background-image: radial-gradient(circle at 50% 26%, rgba(26, 72, 140, .26), rgba(6, 7, 13, 0) 58%);
    }

    /* 面板打开时隐藏局内 HUD，避免盖在遮罩上 */
    body.panel-open #hudL,
    body.panel-open #hudT,
    body.panel-open #hudW,
    body.panel-open #hudBR,
    body.panel-open #minimap,
    body.panel-open #bossWrap,
    body.panel-open #joy,
    body.panel-open #dashBtn,
    body.panel-open .icon-btn {
      display: none !important;
    }

    /* ===== 固定浮层：不随面板内容滚动 ===== */
    #overlay > .float {
      position: absolute;
      z-index: 4;
      display: none;
      pointer-events: none;
    }

    #hint {
      bottom: 50px;
      left: 0;
      right: 0;
      justify-content: center;
      font-size: 12.5px;
      letter-spacing: 1.6px;
      color: #5f7488;
      text-align: center;
    }

    #coinChip {
      top: 18px;
      right: 22px;
      align-items: center;
      gap: 9px;
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 12.5px;
      letter-spacing: 1.4px;
      color: #93aec6;
      background: rgba(14, 26, 44, .94);
      border: 1px solid rgba(90, 150, 220, .32);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .5);
    }

    #coinChip b {
      font-size: 15px;
      letter-spacing: 1px;
      color: #ffd76a;
    }

    /* 标题页：底部给提示条留位置 */
    #overlay.ttl #panel {
      padding-top: 4px;
      padding-bottom: 78px;
    }

    /* 商店：给右上角金币条留位置 */
    #overlay.shop #panel {
      padding-top: 44px;
    }

    /* 升级/宝箱：标题与卡片拉开距离 */
    #overlay.pick {
      background: radial-gradient(circle at 50% 42%, rgba(7, 15, 30, .93), rgba(3, 5, 12, .975));
    }

    #overlay.pick #panel {
      max-width: 1000px;
    }

    #overlay.pick #panel h1 {
      margin-bottom: 22px;
    }

    #overlay.pick .picks {
      margin-top: 34px;
      /* 1~3 张卡都居中，数量少时不会被挤到左边 */
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 18px;
    }

    #overlay.pick .picks > .pickc {
      flex: 1 1 0;
      min-width: 0;
      max-width: 330px;
    }

    /* 暂停/结算：标题、数据、按钮之间拉开距离 */
    #overlay.wide {
      background: radial-gradient(circle at 50% 42%, rgba(7, 15, 30, .94), rgba(3, 5, 12, .99));
    }

    #overlay.wide #panel h1 {
      margin-bottom: 44px;
    }

    #overlay.wide .stat {
      width: 340px;
      max-width: 100%;
      margin: 0 auto;
      padding: 14px 6px;
      font-size: 16px;
    }

    /* 与上面 .stat 行同宽（340px），不然两按钮比数据行宽一截 */
    #overlay.wide .btnrow {
      width: 340px;
      max-width: 100%;
      margin: 46px auto 0;
      gap: 18px;
    }

    #overlay.wide .btnrow .mbtn {
      max-width: none;
    }

    #panel {
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 4px 6px 18px;
      text-align: center;
      scrollbar-width: thin;
      scrollbar-color: rgba(90, 180, 255, .7) rgba(20, 36, 60, .5);
    }

    #panel::-webkit-scrollbar {
      width: 9px;
    }

    #panel::-webkit-scrollbar-track {
      background: rgba(16, 30, 50, .55);
      border-radius: 5px;
    }

    #panel::-webkit-scrollbar-thumb {
      border-radius: 5px;
      background: linear-gradient(180deg, #6cd6ff, #2a7fd4);
      border: 1px solid rgba(10, 20, 34, .8);
      box-shadow: 0 0 8px rgba(90, 200, 255, .55);
    }

    #panel::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #9be8ff, #4a9de0);
    }

    #panel h1 {
      font-size: 34px;
      letter-spacing: 12px;
      color: #eaf7ff;
      margin: 8px 0 12px;
      font-weight: 800;
      text-shadow: 0 0 26px rgba(80, 180, 255, .45);
    }

    #panel h2 {
      font-size: 16px;
      letter-spacing: 4px;
      color: #7fb6e6;
      margin: 22px 0 12px;
      font-weight: 600;
    }

    #panel p {
      font-size: 14px;
      line-height: 1.9;
      color: #8fa8c0;
    }

    #panel b {
      color: #ffd76a;
      font-weight: 600;
    }

    #panel .pickc .own {
      color: #2a1c02;
      font-weight: 800;
      text-shadow: none;
    }

    /* ===== 面板按钮 ===== */
    .mbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      margin: 12px 0 0;
      padding: 15px 22px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #eaf7ff;
      cursor: pointer;
      border-radius: 12px;
      border: 1px solid rgba(120, 200, 255, .55);
      background: linear-gradient(180deg, rgba(58, 132, 214, .92), rgba(24, 70, 132, .96));
      box-shadow: inset 0 1px 0 rgba(180, 225, 255, .3), 0 8px 22px rgba(20, 90, 180, .32);
      transition: transform .12s, box-shadow .15s, filter .15s;
    }

    .mbtn:hover {
      filter: brightness(1.16);
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(200, 235, 255, .4), 0 10px 26px rgba(40, 140, 255, .45);
    }

    .mbtn:active {
      transform: translateY(1px) scale(.995);
      filter: brightness(.95);
    }

    .mbtn.alt {
      background: linear-gradient(180deg, rgba(32, 52, 80, .92), rgba(15, 25, 42, .96));
      border-color: rgba(120, 180, 240, .34);
      color: #a9c8e4;
      box-shadow: inset 0 1px 0 rgba(150, 200, 240, .12);
      letter-spacing: 4px;
    }

    .mbtn.alt:hover {
      filter: brightness(1.32);
      border-color: rgba(150, 205, 255, .55);
    }

    .mbtn:disabled {
      opacity: .4;
      cursor: not-allowed;
      filter: none;
      transform: none;
    }

    .btnrow {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 16px;
    }

    .btnrow .mbtn {
      margin: 0;
      flex: 1;
      max-width: 200px;
    }

    /* 独立主按钮：最宽 200px 居中 */
    #panel > .mbtn,
    .titlebox > .mbtn {
      max-width: 200px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      font-size: 14px;
      letter-spacing: 2px;
      padding: 9px 22px;
      margin: 5px;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(30, 70, 120, .55);
      color: #bfe6ff;
      border: 1px solid rgba(90, 180, 255, .42);
      transition: .16s;
      font-family: inherit;
    }

    .btn:hover {
      background: rgba(45, 110, 180, .82);
      box-shadow: 0 0 18px rgba(60, 160, 255, .45);
    }

    .btn.ghost {
      background: transparent;
      border-color: rgba(120, 160, 200, .26);
      color: #8fa8c0;
    }

    .btn:disabled {
      opacity: .32;
      cursor: not-allowed;
    }

    .btn.warn {
      border-color: rgba(255, 110, 130, .5);
      color: #ffb0be;
      background: rgba(120, 30, 50, .32);
    }

    .card {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      padding: 11px 14px;
      border-radius: 11px;
      background: rgba(22, 40, 66, .66);
      border: 1px solid rgba(90, 170, 255, .28);
      cursor: pointer;
      transition: .14s;
      font-family: inherit;
      color: inherit;
    }

    .card:hover {
      background: rgba(34, 68, 110, .86);
      border-color: #4fc3ff;
      transform: translateX(3px);
    }

    .card .nm {
      color: #d8f2ff;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .card .ds {
      color: #8fa8c0;
      font-size: 11.5px;
      margin-top: 3px;
      line-height: 1.55;
    }

    .card .lv {
      float: right;
      color: #7fd4ff;
      font-size: 11px;
      font-weight: 400;
    }

    .card .tag {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      background: rgba(255, 215, 106, .14);
      color: #ffd76a;
      border: 1px solid rgba(255, 215, 106, .32);
      font-weight: 400;
    }

    .card.evo {
      border-color: rgba(255, 215, 106, .55);
      background: rgba(58, 46, 18, .5);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      margin: 10px 0;
      border-radius: 12px;
      background: rgba(18, 30, 50, .72);
      border: 1px solid rgba(90, 140, 200, .22);
      text-align: left;
    }

    .row .info {
      flex: 1;
      min-width: 0;
    }

    .row .nm {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .5px;
      color: #cfe6f8;
    }

    .row .nm em {
      font-style: normal;
      font-size: 12px;
      font-weight: 400;
      color: #7fd4ff;
      margin-left: 6px;
    }

    .row .ds {
      font-size: 12.5px;
      line-height: 1.5;
      color: #7d95ad;
      margin-top: 5px;
    }

    .row .btn {
      font-size: 12px;
      padding: 6px 13px;
      margin: 0;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 4px;
      font-size: 15px;
      color: #93aec6;
      border-bottom: 1px dashed rgba(90, 130, 180, .16);
    }

    .stat b {
      color: #ffd76a;
      font-weight: 600;
    }

    .grid6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .grid6 div {
      display: grid;
      place-items: center;
      padding: 7px 1px;
      border-radius: 9px;

      border: 1px solid rgba(110, 170, 230, .26);
      font-size: 17px;
      color: #cfe6f8;
    }

    .grid6 div em {
      font-size: 9.5px;
      font-style: normal;
      color: #8fe3ff;
      margin-top: 2px;
    }

    #panel h1.sm {
      font-size: 27px;
      letter-spacing: 7px;
    }

    .sub {
      font-size: 14px !important;
      letter-spacing: 1px;
      color: #7d95ad !important;
      margin-bottom: 4px !important;
    }

    .tip {
      font-size: 12.5px !important;
      letter-spacing: .5px;
      color: #5f7488 !important;
      margin-top: 22px !important;
    }

    .warn {
      font-size: 12.5px !important;
      color: #ff8b9c !important;
      margin: 14px 0 0 !important;
    }

    .ghost {
      background: transparent !important;
      border: 1px solid rgba(120, 180, 240, .3) !important;
      color: #8fb8dc !important;
    }

    .ico {
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(28, 46, 74, .85);
      border: 1px solid rgba(110, 170, 230, .22);
      color: #9fe8ff;
    }

    .ico svg {
      width: 21px;
      height: 21px;
    }

    .chars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 24px 0 4px;
    }

    .char {
      padding: 20px 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(90, 150, 220, .28);
      background: rgba(16, 28, 48, .72);
      cursor: pointer;
      transition: .15s;
    }

    .char:hover {
      border-color: rgba(120, 200, 255, .55);
      background: rgba(22, 40, 66, .85);
    }

    .char.sel {
      border-color: #6ce0ff;
      background: rgba(24, 58, 96, .85);
      box-shadow: 0 0 22px rgba(90, 200, 255, .3);
    }

    .char.lock {
      opacity: .62;
    }

    .char .ci {
      color: #8fe3ff;
      line-height: 1;
      display: flex;
      justify-content: center;
    }

    .char .ci svg {
      width: 34px;
      height: 34px;
    }

    .char .cn {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #dff2ff;
      margin-top: 12px;
    }

    .char .cw {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      margin-top: 9px;
    }

    /* 角色特质：常驻被动，和武器无关 */
    .char .ct {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      border: 1px solid currentColor;
      opacity: .92;
    }

    .char .cd {
      font-size: 12px;
      color: #7d95ad;
      line-height: 1.6;
      margin-top: 8px;
      min-height: 44px;
    }

    .char .cc {
      font-size: 13px;
      letter-spacing: 1px;
      color: #ffd76a;
      margin-top: 10px;
    }

    .row.pick {
      cursor: pointer;
      transition: .15s;
    }

    .row.pick:hover {
      background: rgba(30, 60, 100, .9);
      border-color: rgba(120, 200, 255, .6);
    }

    .row.maxed {
      opacity: .48;
    }

    .row.pick.evo {
      border-color: rgba(255, 215, 106, .45);
      background: rgba(48, 40, 20, .5);
    }

    /* ===== 升级/宝箱三选一：三列卡片 ===== */
    .picks {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 26px;
    }

    .pickc {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 30px 18px 20px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(20, 36, 60, .92), rgba(10, 18, 32, .94));
      border: 1px solid rgba(96, 156, 226, .24);
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    }

    .pickc:hover {
      border-color: #6ce0ff;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(20, 90, 180, .34);
    }

    .pickc.evo {
      border-color: rgba(255, 215, 106, .42);
      background: linear-gradient(180deg, rgba(38, 30, 12, .55), rgba(14, 12, 8, .94));
    }

    /* 满级卡：整体呼吸 + 底部冒火 */
    .pickc.maxed {
      animation: cardBreath 2.4s ease-in-out infinite;
    }

    @keyframes cardBreath {
      0%, 100% {
        box-shadow: 0 0 0 1px rgba(255, 200, 90, .14), 0 10px 30px -20px rgba(255, 160, 40, .55);
        border-color: rgba(255, 176, 64, .34);
      }
      50% {
        box-shadow: 0 0 0 2px rgba(255, 214, 106, .5), 0 18px 44px -14px rgba(255, 140, 30, .85);
        border-color: rgba(255, 196, 96, .78);
      }
    }

    .pickc .fire {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      pointer-events: none;
      border-radius: 0 0 15px 15px;
      overflow: hidden;
      z-index: 1;
      -webkit-mask-image: linear-gradient(to top, #000 34%, rgba(0, 0, 0, .45) 66%, transparent 100%);
      mask-image: linear-gradient(to top, #000 34%, rgba(0, 0, 0, .45) 66%, transparent 100%);
    }

    .pickc .fire i {
      position: absolute;
      bottom: -22px;
      width: 34%;
      height: 62px;
      border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
      filter: blur(11px);
      background: radial-gradient(circle at 50% 74%, rgba(255, 226, 150, .95), rgba(255, 138, 34, .72) 42%, rgba(255, 62, 0, 0) 76%);
      animation: fireUp 1.4s ease-in-out infinite;
    }

    .pickc .fire i:nth-child(1) { left: 2%; animation-delay: 0s; }
    .pickc .fire i:nth-child(2) { left: 33%; animation-delay: .3s; height: 74px; width: 30%; }
    .pickc .fire i:nth-child(3) { left: 65%; animation-delay: .62s; height: 58px; }

    @keyframes fireUp {
      0%, 100% { transform: translateY(4px) scaleX(.92) scaleY(.8) rotate(-3deg); opacity: .68; }
      40% { transform: translateY(-9px) scaleX(1.1) scaleY(1.14) rotate(2deg); opacity: 1; }
      70% { transform: translateY(-4px) scaleX(1.04) scaleY(.96) rotate(-1deg); opacity: .86; }
    }

    /* 角标 / 技能标签轻微呼吸 */
    .badge.new,
    .badge.max {
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* 图标块 */
    .pickc .ico {
      width: 82px;
      height: 82px;
      border-radius: 19px;
      margin: 4px 0 16px;
      border-width: 1.5px;
      box-shadow: 0 0 40px -8px currentColor, inset 0 0 26px -14px currentColor;
    }

    .pickc .ico svg {
      width: 37px;
      height: 37px;
      filter: drop-shadow(0 0 10px currentColor);
    }

    /* [旧值 → 新值] 数值行 */
    .pickc .stat {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px 8px;
      font-size: 11.5px;
      line-height: 1.8;
      letter-spacing: .3px;
      text-align: center;
      color: #8397ab;
      margin-bottom: 10px;
    }

    .pickc .stat span {
      white-space: nowrap;
    }

    .pickc .stat span + span::before {
      content: "·";
      color: #4e637a;
      margin-right: 6px;
    }

    .pickc .stat b {
      color: #dff1ff;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .pickc .stat s {
      text-decoration: none;
      color: #4e637a;
      margin: 0 2px;
    }

    .pickc .pn {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #dff2ff;
    }

    .pickc .pt {
      margin-top: 3px;
      font-size: 10.5px;
      letter-spacing: 2px;
      color: #7d95ad;
    }

    /* 没拿到对应武器时，专属技能只是等级，不会触发 */
    .pickc .needw {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: .5px;
      color: #ffb27d;
    }

    .pickc .pl {
      font-size: 11.5px;
      letter-spacing: 1.5px;
      color: #7fd4ff;
    }

    .pickc .pd {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.75;
      text-align: center;
      color: #9db3c7;
      min-height: 44px;
    }

    /* 等级进度：五格（武器 / 技能 / 被动统一，颜色跟随卡片） */
    .pickc .pips {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding-top: 16px;
      justify-content: center;
    }

    .pickc .pips i {
      width: 18px;
      height: 5px;
      border-radius: 3px;
      transform: none;
      background: rgba(180, 196, 214, .2);
    }

    .pickc .pips i.on {
      background: currentColor;
      box-shadow: 0 0 10px -1px currentColor;
    }

    /* 本次将要拿到的那一格 */
    .pickc .pips i.gain {
      background: rgba(255, 255, 255, .2);
      box-shadow: inset 0 0 0 1px currentColor, 0 0 10px -2px currentColor;
      animation: gainPulse 1.5s ease-in-out infinite;
    }

    @keyframes gainPulse {
      0%, 100% { opacity: .5; }
      50% { opacity: 1; }
    }

    /* 刷新按钮 */
    .refbtn {
      display: block;
      margin: 26px auto 0;
      padding: 12px 30px;
      border-radius: 11px;
      font: inherit;
      font-size: 13.5px;
      letter-spacing: 2px;
      color: #bcd6ee;
      background: rgba(20, 36, 58, .82);
      border: 1px solid rgba(110, 170, 230, .3);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }

    .refbtn:hover:not([disabled]) {
      border-color: #6ce0ff;
      color: #eaf7ff;
      background: rgba(28, 52, 84, .9);
    }

    .refbtn[disabled] {
      opacity: .38;
      cursor: default;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 2px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1px solid;
      z-index: 2;
    }

    /* 技能卡左上角：所属武器 + 专属 */
    .pickc .own {
      position: absolute;
      top: 10px;
      left: 12px;
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .5px;
      color: #241a04;
      background: linear-gradient(180deg, #ffe08a, #f0b64a);
      box-shadow: 0 0 16px -4px rgba(255, 215, 106, .9);
      z-index: 2;
    }

    /* 武器 / 技能卡的等级行（无限流没有等级点） */
    .pickc .lvline {
      margin-top: auto;
      padding-top: 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #7fd4ff;
    }

    .badge.new {
      color: #ffd76a;
      border-color: rgba(255, 215, 106, .6);
      background: rgba(58, 44, 10, .96);
      box-shadow: 0 0 16px rgba(255, 215, 106, .5);
    }

    .badge.max {
      color: #ff8b9c;
      border-color: rgba(255, 107, 129, .6);
      background: rgba(58, 14, 24, .96);
      box-shadow: 0 0 16px rgba(255, 107, 129, .45);
    }

    /* ===== 局外强化网格 ===== */
    .shop {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .mcard {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 17px 12px 14px;
      border-radius: 14px;
      background: rgba(16, 28, 48, .8);
      border: 1px solid rgba(90, 150, 220, .24);
      transition: border-color .15s, transform .15s, background .15s;
    }

    .mcard:hover {
      border-color: rgba(120, 200, 255, .5);
      background: rgba(22, 40, 66, .86);
      transform: translateY(-2px);
    }

    .mcard.maxed {
      opacity: .46;
    }

    .mcard .ico {
      width: 46px;
      height: 46px;
      border-radius: 13px;
    }

    .mcard .ico svg {
      width: 24px;
      height: 24px;
    }

    .mcard .mn {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #dff2ff;
    }

    .mcard .md {
      font-size: 11.5px;
      line-height: 1.55;
      color: #7d95ad;
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    .pips {
      display: flex;
      gap: 5px;
      margin: -1px 0 2px;
    }

    /* 暂停页设置列表 */
    .setlist {
      margin: 4px auto 30px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 12px;
      background: rgba(20, 36, 58, .62);
      border: 1px solid rgba(110, 170, 230, .18);
      color: #cfe3f7;
      font-size: 13.5px;
      letter-spacing: 1.5px;
      cursor: pointer;
      user-select: none;
      transition: border-color .15s, background .15s;
    }

    .setrow:hover {
      border-color: rgba(120, 200, 255, .42);
    }

    .setrow .sw {
      position: relative;
      flex: 0 0 auto;
      width: 42px;
      height: 23px;
      border-radius: 12px;
      background: rgba(96, 124, 158, .38);
      transition: background .16s;
    }

    .setrow .sw::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #93a9bf;
      transition: left .16s, background .16s;
    }

    .setrow.on .sw {
      background: rgba(52, 146, 240, .72);
    }

    .setrow.on .sw::after {
      left: 22px;
      background: #eaf6ff;
    }

    /* 音量滑杆：不显示默认轨道，换成和面板一致的游戏风细轨 */
    .setrow.vol {
      cursor: default;
      gap: 12px;
    }

    .setrow.vol input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 auto;
      min-width: 90px;
      max-width: 150px;
      height: 4px;
      border-radius: 3px;
      background: rgba(96, 124, 158, .48);
      outline: none;
      cursor: pointer;
    }

    .setrow.vol input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #eaf6ff;
      border: 2px solid #4fa8f0;
      box-shadow: 0 0 8px rgba(90, 190, 255, .7);
      cursor: pointer;
    }

    .setrow.vol input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #eaf6ff;
      border: 2px solid #4fa8f0;
      cursor: pointer;
    }

    /* 宝箱页：进化条件提示 */
    .evohint {
      margin: 16px auto 0;
      max-width: 640px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.8;
      color: #ffb27d;
    }

    .pickc .evoNeed {
      margin-top: 6px;
      font-size: 11.5px;
      color: #8be0a8;
      letter-spacing: .5px;
    }

    /* 被动卡上的「X族武器进化前置条件」提示（颜色由族色内联给出） */
    .pickc .evoFam {
      margin-top: 8px;
      font-size: 11.5px;
      line-height: 1.5;
      letter-spacing: .5px;
    }

    .linkbtn {
      margin: 18px auto 0;
      display: block;
      padding: 6px 10px;
      background: none;
      border: 0;
      color: #7d95ad;
      font: inherit;

    .linkbtn:hover {
      color: #a9cbe6;
    }

    .pips i {
      width: 7px;
      height: 7px;
      border-radius: 2px;

      background: rgba(120, 160, 200, .22);
    }

    .pips i.on {
      background: #6cd6ff;
      box-shadow: 0 0 8px rgba(108, 214, 255, .85);
    }

    .mcard .mbtn {
      width: 100%;
      min-height: 40px;
      margin: 0;
      padding: 9px 6px;
      font-size: 13px;
      letter-spacing: 1px;
      border-radius: 10px;

      padding: 10px 0 4px;
    }

      margin: 6px 0 16px;
    }

    .titlebox .sub {

    }

      margin-top: 0;
    }

    .titlebox .stats {

    .stats {

    }

    .stats div {

      min-width: 132px;
    }

    .stats span {

    .stats b {

      letter-spacing: 1px;

    #dashBtn {
      display: none;
    }

    body.touch #dashBtn {
      display: grid;
      position: fixed;
      right: 22px;
      bottom: 104px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(130, 200, 255, .4);
      background: rgba(20, 40, 70, .55);
      color: #8fe3ff;
      font-size: 24px;
      place-items: center;
      z-index: 12;

      background: rgba(60, 140, 220, .55);
    }

    /* ===== GM 调试（左下角） ===== */
    #gmBtn {

      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 41;

      border: 1px solid rgba(140, 220, 180, .45);

      max-height: min(74vh, 620px);
      overflow: hidden;
      flex-direction: column;
      border-radius: 14px;
      border: 1px solid rgba(120, 180, 240, .22);
      background: linear-gradient(180deg, rgba(10, 20, 34, .97), rgba(6, 12, 22, .98));
      box-shadow: 0 18px 50px rgba(0, 0, 0, .6);

      letter-spacing: 1px;
      color: #8ef0b8;
    }

    #gmStats {
      display: none;
      position: fixed;
      left: 346px;
      bottom: 68px;

      overflow-y: auto;
      box-sizing: border-box;
      padding: 10px 12px 18px;

        k = kinds[i];

    }

    if (s % 4 === 0) mtone(cfg.root * (s % 16 === 8 ? 0.943 : 1), t, step * 3.2, "triangle", 0.085);
    mtone(cfg.root * 4 * Math.pow(2, semi / 12) * (oct === 2 ? 2 : 1), t, step * 1.5, "sine", 0.05);
    if (s % 2 === 1) mtone(cfg.root * 16 * Math.pow(2, semi / 12), t, step * 0.32, "square", 0.012);
    bgmStep++;
    bgmNext = t + step;
  }
}
function bgmSetMode(m) {
  if (bgmMode === m) return;
  bgmMode = m;
  if (AC) bgmNext = AC.currentTime + 0.05;
}
/* 切到后台（或最小化、锁屏）时把音频上下文挂起，调度器一并停掉，

let bgmHidden = false;

    clearInterval(bgmTimer);
    bgmTimer = null;
  }
  if (AC && AC.state === "running") {
    try {
      AC.suspend();
    } catch (e) {
    }
  }
}
function bgmResume() {
  if (!bgmHidden) return;
  bgmHidden = false;
  if (!AC) return;
  try {
    AC.resume();
  } catch (e) {
  }
  bgmNext = AC.currentTime + 0.05;
  if (!bgmTimer) bgmTimer = setInterval(bgmTick, 60);
}
document.addEventListener("visibilitychange", () => {

});

addEventListener("pageshow", bgmResume);

let saveOk = true;
function defSave() {
  /* 加减字段直接改这里：loadSave 用 Object.assign 补默认值，不再有版本号和旧档迁移 */
  return { coins: 0, up: {}, chars: { tri: 1 }, pick: "tri", bestTime: 0, bestKill: 0, bestCoin: 0 };
}
let save = defSave();
function loadSave() {
  let raw = null;
  try {
    raw = JSON.parse(localStorage.getItem(DATA_KEY) || "null");
  } catch (e) {
    raw = null;
  }
  if (raw) save = Object.assign(defSave(), raw);
  if (!save.up) save.up = {};
  if (!save.chars) save.chars = {};
  if (typeof save.pick !== "string") save.pick = "tri";
  ["bestTime", "bestKill", "bestCoin"].forEach(k => {
    if (typeof save[k] !== "number" || !isFinite(save[k])) save[k] = 0;
  });
  if (typeof save.coins !== "number" || !isFinite(save.coins) || save.coins < 0) save.coins = 0;
  save.coins = Math.floor(save.coins);
  save.chars.tri = 1;
  loadSet();
  persist();
  persistSet();
}
function persist() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(save));
    saveOk = true;
  } catch (e) {
    saveOk = false;
  }
}
let lastT = 0;
function bootGame() {
  const joyEl = $("joy");

    joy.active = true;
    joy.id = id;
    joy.cx = x;
    joy.cy = y;
    joy.dx = 0;
    joy.dy = 0;
    joy.mag = 0;
    joyEl.style.display = "block";
    joyEl.style.left = x + "px";

    if (m > R) {
      dx = dx / m * R;
      dy = dy / m * R;
    }
    joy.dx = dx / R;
    joy.dy = dy / R;
    joy.mag = Math.min(1, m / R);

  }
  function joyEnd() {

  function gmPill(label, act, on) {

  }
