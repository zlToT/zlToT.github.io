<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>引力井 · 歼灭</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #05060f;
      font-family: "Segoe UI", monospace
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 64px;
      color: #9df3ff;
      font-size: 14px;
      pointer-events: none;
      text-shadow: 0 0 6px #0af
    }

    .bar {
      width: 180px;
      height: 10px;
      border: 1px solid #2af;
      border-radius: 5px;
      margin-top: 4px;
      overflow: hidden
    }

    #fuelFill {
      height: 100%;
      background: linear-gradient(90deg, #0ff, #08f);
      width: 100%
    }

    #hpBar {
      border-color: #a33
    }

    #hpFill {
      height: 100%;
      background: linear-gradient(90deg, #f55, #a22);
      width: 100%
    }

    #xpBar {
      border-color: #3a3
    }

    #xpFill {
      height: 100%;
      background: linear-gradient(90deg, #5f5, #2a2);
      width: 0%
    }

    #best {
      margin-top: 6px;
      color: #fc3;
      font-size: 12px
    }

    #dustHud {
      position: fixed;
      top: 12px;
      right: 116px;
      color: #fd6;
      font-size: 14px;
      text-align: right;
      text-shadow: 0 0 6px #a60
    }

    #xpWrap {
      margin-top: 4px;
      color: #8f8;
      font-size: 12px
    }

    #timer {
      color: #fff;
      font-size: 16px;
      font-weight: bold
    }

    .top-btn {
      position: fixed;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 25, 40, 0.7);
      backdrop-filter: blur(10px);
      color: #cfe;
      font-size: 18px;
      cursor: pointer;
      z-index: 200;
      display: grid;
      place-items: center;
    }

    .top-btn:hover {
      background: rgba(40, 80, 140, 0.8);
    }

    #backBtn {
      top: 12px;
      left: 12px
    }

    #muteBtn {
      top: 12px;
      right: 64px
    }

    #pauseBtn {
      top: 12px;
      right: 12px
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 5, 15, .78);
      z-index: 10;
      pointer-events: none
    }

    #panel {
      text-align: center;
      color: #cfe;
      padding: 26px 36px;
      border: 1px solid #234;
      border-radius: 14px;
      background: rgba(10, 15, 35, .94);
      box-shadow: 0 0 40px rgba(0, 120, 255, .15);
      max-height: 92vh;
      overflow: auto;
      pointer-events: auto
    }

    #panel h1 {
      font-size: 30px;
      color: #7df;
      letter-spacing: 6px;
      margin-bottom: 8px
    }

    #panel p {
      font-size: 13px;
      color: #8ac;
      line-height: 1.7;
      margin-bottom: 12px
    }

    #panel button {
      font-size: 15px;
      padding: 8px 26px;
      border-radius: 8px;
      cursor: pointer;
      background: #0a2a4a;
      color: #7df;
      border: 1px solid #2af;
      transition: .2s;
      margin: 4px
    }

    #panel button:hover {
      background: #0d4a7a;
      box-shadow: 0 0 16px #0af
    }

    #reason {
      color: #f88;
      margin-bottom: 8px
    }

    #win {
      color: #7f7;
      margin-bottom: 8px
    }

    .card {
      display: block;
      width: 340px;
      text-align: left;
      background: rgba(20, 40, 70, .7);
      border: 1px solid #2af;
      border-radius: 10px;
      padding: 10px 14px;
      margin: 7px auto;
      cursor: pointer;
      transition: .15s
    }

    .card:hover {
      background: rgba(30, 70, 120, .8);
      box-shadow: 0 0 14px #0af;
      transform: translateX(4px)
    }

    .card .nm {
      color: #7df;
      font-size: 15px;
      font-weight: bold
    }

    .card .ds {
      color: #9bc;
      font-size: 12px;
      margin-top: 2px
    }

    .shopItem {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      background: rgba(20, 30, 60, .6);
      border: 1px solid #234;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 6px 0;
      min-width: 380px
    }

    .shopItem .info {
      flex: 1
    }

    .shopItem .nm {
      color: #7df;
      font-size: 14px
    }

    .shopItem .ds {
      color: #789;
      font-size: 11px
    }

    .shopItem .lv {
      color: #fc3;
      font-size: 11px
    }

    .shopItem button {
      font-size: 12px;
      padding: 5px 12px;
      white-space: nowrap
    }

    .pips {
      color: #0cf;
      font-size: 11px;
      letter-spacing: 2px
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      width: 320px;
      margin: 6px auto;
      font-size: 14px;
      color: #9bc
    }

    .stat-row b {
      color: #fd6
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <button id="backBtn" class="top-btn" title="返回">⬅</button>
  <button id="muteBtn" class="top-btn" title="静音">🔊</button>
  <button id="pauseBtn" class="top-btn" title="暂停">⏸</button>
  <div id="hud">
    <span id="timer">00:00</span> ｜ 分数 <span id="score">0</span> ｜ 深度 <span id="depth">1</span> ｜ 击杀 <span
      id="kills">0</span>
    <div id="hpBar" class="bar">
      <div id="hpFill"></div>
    </div>
    <div class="bar">
      <div id="fuelFill"></div>
    </div>
    <div id="xpBar" class="bar">
      <div id="xpFill"></div>
    </div>
    <div id="best"></div>
  </div>
  <div id="dustHud">✦ <span id="dustRun">0</span>（×<span id="dustMult">1.0</span>）
    <div id="xpWrap">LV <span id="lv">1</span></div>
  </div>
  <div id="overlay">
    <div id="panel" style="display:none"></div>
  </div>

  <script>
    "use strict";
    const cv = document.getElementById("c"), ctx = cv.getContext("2d");
    let CW = 0, CH = 0;
    function resize() { CW = cv.width = innerWidth; CH = cv.height = innerHeight; }
    addEventListener("resize", resize); resize();
    const W = 3000, H = 2200;
    const $ = id => document.getElementById(id);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const RUN_LEN = 600; // 10分钟撤离

    // 移动端震动
    function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }

    // ===== 静音 =====
    let muted = localStorage.getItem("gw_muted2") === "1";
    function syncMuteBtn() { $("muteBtn").textContent = muted ? "🔇" : "🔊"; }
    function toggleMute() {
      muted = !muted;
      localStorage.setItem("gw_muted2", muted ? "1" : "0");
      syncMuteBtn();
      if (muted && humGain) humGain.gain.value = 0;
    }
    syncMuteBtn();

    // ===== 局外存档（带版本号）=====
    const SAVE_VER = 1;
    const COSTS = [10, 20, 35, 55, 80];
    const UPGRADES = [
      { key: "thrust", nm: "⚙️ 引擎强化", ds: "推力 +8%/级", max: 5 },
      { key: "fuel", nm: "⛽ 扩容燃料仓", ds: "燃料上限 +15/级", max: 5 },
      { key: "hull", nm: "❤️ 装甲板", ds: "最大船体 +1/级", max: 3, costs: [60, 110, 170] },
      { key: "weapon", nm: "⚔️ 武器核心", ds: "基础伤害 +1/级", max: 3, costs: [80, 140, 220] },
      { key: "shield", nm: "🛡️ 出厂护盾", ds: "每局开局自带一层护盾", max: 1, costs: [120] },
      { key: "plunder", nm: "🏴‍☠️ 掠夺者", ds: "金色碎片星尘 +1/级", max: 4, costs: [20, 40, 70, 110] },
    ];
    let save;
    function defaultSave() {
      const s = { v: SAVE_VER, dust: 0, up: {} };
      UPGRADES.forEach(u => s.up[u.key] = 0);
      return s;
    }
    function loadSave() {
      try { save = JSON.parse(localStorage.getItem("gw_meta2")) || null; } catch (e) { save = null; }
      if (!save || typeof save !== "object" || save.v !== SAVE_VER) save = defaultSave();
      UPGRADES.forEach(u => { if (!Number.isInteger(save.up[u.key])) save.up[u.key] = 0; });
    }
    function persist() { localStorage.setItem("gw_meta2", JSON.stringify(save)); }
    function lv(k) { return save.up[k]; }
    function upCost(u) { const l = lv(u.key); return u.costs ? u.costs[l] : COSTS[l]; }
    loadSave();

    // ===== 局内升级池（AOE/单体两条 build 线，数值见各 apply）=====
    const RUNUP = [
      { id: "firerate", nm: "🔥 速射机构", ds: "射击间隔 -15%", max: 5, apply: r => r.cd *= 0.85 },
      { id: "dmg", nm: "💥 弹头强化", ds: "所有伤害 +30%", max: 5, apply: r => r.dmgMul *= 1.3 },
      { id: "multi", nm: "🔱 多重炮", ds: "齐射 +1 发（平行弹幕）", max: 3, apply: r => r.multi += 1 },
      { id: "pierce", nm: "🎯 穿透弹头", ds: "子弹贯穿 +2 个敌人", max: 3, apply: r => r.pierce += 2 },
      { id: "boom", nm: "💣 爆破弹头", ds: "子弹命中爆炸！范围+威力提升", max: 4, apply: r => { r.boom = r.boom ? r.boom + 30 : 80; r.boomLvl++; } },
      { id: "nova", nm: "🌟 冲击新星", ds: "周期冲击波：高伤+击退", max: 4, apply: r => r.nova += 1 },
      { id: "chain", nm: "⚡ 连锁闪电", ds: "电弧在敌人间跳跃，+1 跳", max: 4, apply: r => r.chain += 1 },
      { id: "orbital", nm: "🛰️ 轨道打击", ds: "卫星锁定+1，周期性天降轰炸", max: 3, apply: r => r.orbital += 1 },
      { id: "torpedo", nm: "🕳️ 湮灭鱼雷", ds: "鱼雷+1 枚，命中坍缩爆吸敌群", max: 3, apply: r => r.torpedo += 1 },
      { id: "engine", nm: "🚀 引擎过载", ds: "牵引推力 +10%", max: 5, apply: r => r.engine *= 1.1 },
      { id: "regen", nm: "♻️ 能量循环", ds: "低能量保底回充速度 +20%", max: 4, apply: r => r.regen *= 1.2 },
      { id: "repair", nm: "🛠️ 紧急维修", ds: "最大船体 +1 并完全修复", max: 9, apply: () => { maxHp++; hp = maxHp; } },
      { id: "shieldc", nm: "🛡️ 应急护盾", ds: "立即获得一层护盾", max: 9, apply: () => { shieldUp = true; } },
    ];
    let run = null, runLv = null;

    // 升级经验需求表（V3：整体上调约 30%，表外按末项 +10 递增）
    const XP_TABLE = [7, 9, 13, 17, 21, 26, 31, 38, 44, 52, 60, 69, 78];
    function nextXpNeed(l) {
      if (l <= XP_TABLE.length) return XP_TABLE[l - 1];
      return XP_TABLE[XP_TABLE.length - 1] + (l - XP_TABLE.length) * 10;
    }

    // ===== 刷怪导演：按分钟脚本（怪种逐步解锁，怪潮平滑爬坡）=====
    const WAVES = [
      { min: 0, cap: 35, rate: 2.6, w: { swarm: 1 } },
      { min: 1, cap: 55, rate: 4.2, w: { swarm: 1, bomber: .25 }, surge: 26 },
      { min: 2, cap: 80, rate: 5.8, w: { swarm: 1, bomber: .3, shooter: .2 }, surge: 32 },
      { min: 3, cap: 105, rate: 7.5, w: { swarm: 1.1, bomber: .35, shooter: .3, tank: .1 }, surge: 38 },
      { min: 4, cap: 135, rate: 9.2, w: { swarm: 1.2, bomber: .4, shooter: .35, tank: .15, splitter: .25 }, surge: 44 },
      { min: 5, cap: 170, rate: 11, w: { swarm: 1.3, bomber: .45, shooter: .4, tank: .2, splitter: .35 }, surge: 52 },
      { min: 6, cap: 205, rate: 13, w: { swarm: 1.4, bomber: .5, shooter: .45, tank: .25, splitter: .4 }, surge: 60 },
      { min: 7, cap: 240, rate: 15, w: { swarm: 1.5, bomber: .55, shooter: .5, tank: .3, splitter: .5 }, surge: 70 },
      { min: 8, cap: 275, rate: 17.5, w: { swarm: 1.6, bomber: .6, shooter: .55, tank: .35, splitter: .55 }, surge: 80 },
      { min: 9, cap: 300, rate: 20, w: { swarm: 1.7, bomber: .7, shooter: .6, tank: .4, splitter: .6 }, surge: 90 },
    ];
    function waveCfg() { return WAVES[Math.min(9, Math.floor(elapsed / 60))]; }

    // ===== 运行时 =====
    let state = "title", holding = false, paused = false;
    let player, fragments, holes, particles, stars, texts, portal, enemies, bullets, ebullets, orbs, booms, bolts, chest, strikes, torpedoes;
    let orbPool = [], particlePool = [];
    let fuel, fuelMax, hp, maxHp, score, best = +localStorage.getItem("gw_best3") || 0, bestDepth = +localStorage.getItem("gw_bestd3") || 1;
    let camX = 0, camY = 0, shake = 0, dustRun = 0, shieldUp = false, invuln = 0, trail = [];
    let depth = 1, fragCount = 0, kills = 0, maxCombo = 0, combo = 0, comboT = 0, xp = 0, level = 1, xpNeed = 5, elapsed = 0, fireT = 0;
    let budget = 0, surgeMin = -1, eliteTimes = [], won = false;
    let hitStop = 0;
    const mouse = { x: 0, y: 0 };
    stars = [];
    for (let i = 0; i < 220; i++)stars.push({
      x: Math.random() * CW * 2, y: Math.random() * CW * 2,
      s: Math.random() * 1.6 + .4, l: i < 130 ? .25 : .55
    });

    // ===== 粒子池（数量封顶，复用对象，控制 GC）=====
    const MAX_PARTICLES = 420;
    function spawnParticle(o) {
      let q;
      if (particles.length >= MAX_PARTICLES) {
        q = particles.shift();
      } else {
        q = particlePool.pop() || {};
      }
      Object.assign(q, o);
      q.maxLife = o.life;
      particles.push(q);
      return q;
    }

    function stats() {
      return {
        thrust: 250 * (1 + .08 * lv("thrust")),
        dmg: 1 + lv("weapon"),
        plunder: lv("plunder")
      };
    }
    // 深度倍率 × 连杀倍率（封顶防数字膨胀）
    function depthMult() { return 1 + 0.4 * (depth - 1); }
    function comboMult() { return 1 + Math.min(combo, 40) * 0.02; }

    function reset() {
      player = {
        x: W / 2, y: H / 2, vx: 0, vy: 0, r: 12, ang: 0,
        verts: Array.from({ length: 8 }, (_, i) => ({ a: i / 8 * Math.PI * 2, d: rnd(8, 13) }))
      };
      fragments = []; holes = []; particles = []; trail = []; texts = []; portal = null;
      enemies = []; bullets = []; ebullets = []; orbs = []; booms = []; bolts = []; chest = null;
      strikes = []; torpedoes = [];
      fuelMax = 100 + 15 * lv("fuel"); fuel = fuelMax;
      maxHp = 3 + lv("hull"); hp = maxHp;
      score = 0; shake = 0; dustRun = 0; shieldUp = lv("shield") > 0; invuln = 1.5;
      depth = 1; fragCount = 0; kills = 0; maxCombo = 0; combo = 0; comboT = 0;
      xp = 0; level = 1; xpNeed = 5; elapsed = 0; fireT = 0; hitStop = 0;
      budget = 0; surgeMin = -1; won = false;
      eliteTimes = [150, 330, 510, 690, 870];
      // 开局即双发，前 30 秒不刮痧
      run = {
        cd: .35, dmgMul: 1, multi: 2, pierce: 0, boom: 0, boomLvl: 0, nova: 0, novaT: 3,
        chain: 0, chainT: 2.5, orbital: 0, orbitalT: 3, torpedo: 0, torpedoT: 3,
        engine: 1, regen: 1, bspd: 1, range: 700
      };
      runLv = {};
      for (let i = 0; i < 2; i++)spawnHole(true);
      for (let i = 0; i < 10; i++)spawnFragment();
    }
    function spawnHole(init) {
      let x, y, t = 0;
      do { x = rnd(200, W - 200); y = rnd(200, H - 200); t++; }
      while (t < 50 && (Math.hypot(x - player.x, y - player.y) < (init ? 500 : 700) ||
        holes.some(h => Math.hypot(x - h.x, y - h.y) < 420)));
      holes.push({ x, y, core: 26, pull: 500, rot: rnd(0, 6), grazed: false });
    }
    function spawnFragment() {
      let x, y, t = 0;
      do { x = rnd(80, W - 80); y = rnd(80, H - 80); t++; }
      while (t < 50 && (Math.hypot(x - player.x, y - player.y) < 420 ||
        holes.some(h => Math.hypot(x - h.x, y - h.y) < 300)));
      fragments.push({ x, y, ph: rnd(0, 6), risky: false });
    }
    function spawnAny() {
      if (holes.length && Math.random() < 0.3) {
        const h = holes[Math.floor(Math.random() * holes.length)];
        const a = rnd(0, 6.28), dist = rnd(h.pull * 0.5, h.pull * 0.78);
        fragments.push({
          x: Math.max(40, Math.min(W - 40, h.x + Math.cos(a) * dist)),
          y: Math.max(40, Math.min(H - 40, h.y + Math.sin(a) * dist)), ph: rnd(0, 6), risky: true
        });
      } else spawnFragment();
    }
    function spawnPortal() {
      let x, y, t = 0;
      do { x = rnd(200, W - 200); y = rnd(200, H - 200); t++; }
      while (t < 80 && (Math.hypot(x - player.x, y - player.y) < 600 ||
        holes.some(h => Math.hypot(x - h.x, y - h.y) < h.pull + 100)));
      portal = { x, y, rot: 0 }; beep(520, .3, "sine", .15, 1040);
      texts.push({ x: player.x, y: player.y - 60, txt: "⬇ 裂隙已开启，沿箭头走", life: 2.5, c: "#5ff", big: true });
    }

    // ===== 怪物工厂 =====
    // 怪物成长（V3：系数放大 50%）
    function hpMul() { return 1 + elapsed * 0.06 + (depth - 1) * 0.675; }
    function baseEnemy(x, y, type) {
      const m = hpMul();
      const T = {
        swarm: { r: 8, hp: 2 * m, spd: rnd(125, 165), xpv: 1, sc: 3, col: "#f55", dmg: 1, shape: 3 },
        bomber: { r: 10, hp: 3 * m, spd: 200, xpv: 1, sc: 5, col: "#fa5", dmg: 1, shape: 4 },
        shooter: { r: 11, hp: 4 * m, spd: 75, xpv: 2, sc: 8, col: "#f8f", dmg: 1, shape: 5, ft: rnd(1, 2.5) },
        tank: { r: 20, hp: 24 * m, spd: 45, xpv: 5, sc: 20, col: "#8ac", dmg: 2, shape: 6 },
        splitter: { r: 13, hp: 6 * m, spd: 100, xpv: 2, sc: 8, col: "#ff5", dmg: 1, shape: 4 },
        mini: { r: 6, hp: 1 * m, spd: 160, xpv: 1, sc: 2, col: "#fd5", dmg: 1, shape: 3 },
        elite: { r: 24, hp: 55 * m, spd: 80, xpv: 12, sc: 80, col: "#f0f", dmg: 2, shape: 6, ft: 1.8, elite: true },
      }[type];
      return {
        x, y, vx: 0, vy: 0, type, r: T.r, hp: T.hp, maxHp: T.hp, spd: T.spd, xpv: T.xpv, sc: T.sc,
        col: T.col, dmg: T.dmg, shape: T.shape, rot: 0, ft: T.ft || 0, hitCd: 0, elite: T.elite, flash: 0
      };
    }
    function ringPos() {
      const a = rnd(0, 6.28), d = Math.max(CW, CH) / 2 + rnd(60, 260);
      return {
        x: Math.max(40, Math.min(W - 40, player.x + Math.cos(a) * d)),
        y: Math.max(40, Math.min(H - 40, player.y + Math.sin(a) * d))
      };
    }
    function pickType(w) {
      let tot = 0; for (const k in w) tot += w[k];
      let pick = Math.random() * tot;
      for (const k in w) { pick -= w[k]; if (pick <= 0) return k; }
      return "swarm";
    }
    function directorSpawn() {
      const cfg = waveCfg();
      budget += cfg.rate * 0.5;
      while (budget >= 1) {
        budget -= 1;
        if (enemies.length >= cfg.cap) break;
        const type = pickType(cfg.w);
        const pos = ringPos();
        if (type === "swarm") {
          for (let i = 0; i < 3 && enemies.length < cfg.cap; i++)
            enemies.push(baseEnemy(pos.x + rnd(-90, 90), pos.y + rnd(-90, 90), "swarm"));
        } else enemies.push(baseEnemy(pos.x, pos.y, type));
      }
    }
    function spawnSurge(n) {
      const a = rnd(0, 6.28);
      texts.push({ x: player.x, y: player.y - 60, txt: "⚠ 怪潮来袭！", life: 2, c: "#f55", big: true });
      beep(220, .5, "sawtooth", .2, 440);
      for (let i = 0; i < n; i++) {
        const d = Math.max(CW, CH) / 2 + 80 + i * 18, aa = a + rnd(-.4, .4);
        const x = Math.max(50, Math.min(W - 50, player.x + Math.cos(aa) * d));

          ctx.beginPath(); ctx.arc(q.x, q.y, 3 * q.life / .4, 0, 6.29); ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (invuln > 0 && Math.floor(t / 60) % 2) ctx.globalAlpha = .4;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
        ctx.fillStyle = "#d94"; ctx.strokeStyle = "#fa5"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        p.verts.forEach((v, i) => {
          const x = Math.cos(v.a) * v.d, y = Math.sin(v.a) * v.d;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.globalAlpha = 1;
        if (shieldUp) {
          ctx.strokeStyle = "rgba(0,255,255," + (.5 + Math.sin(t * .006) * .3) + ")";
          ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, 6.29); ctx.stroke();
        }
        if (holding && fuel > 0) {
          ctx.strokeStyle = "rgba(0,200,255,.35)"; ctx.setLineDash([6, 8]);
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      for (const q of texts) {
        ctx.globalAlpha = Math.min(1, q.life);
        ctx.fillStyle = q.c;
        ctx.font = (q.big ? "bold 18px" : q.small ? "bold 13px" : "14px") + " monospace";
        ctx.textAlign = "center";
        ctx.fillText(q.txt, q.x, q.y);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.strokeStyle = "rgba(80,120,200,.3)"; ctx.lineWidth = 3;
      ctx.strokeRect(-camX + sx, -camY + sy, W, H);
      // 边缘指引：裂隙 + 宝箱
      if (state === "playing") {
        if (portal) edgeArrow(portal.x, portal.y, "rgba(94,234,212,.95)", "裂隙");
        if (chest) edgeArrow(chest.x, chest.y, "rgba(253,224,71,.95)", "宝箱");
      }
    }

    // ===== 主循环 =====
    let last = performance.now();
    function loop(t) {
      const dt = Math.min(.033, (t - last) / 1000); last = t;
      if (hitStop > 0) {
        hitStop -= dt; // 命中停顿：世界冻结但继续渲染
      } else if (state === "playing" && !paused) {
        update(dt);
      }
      shake = Math.max(0, shake - dt * 30);
      draw(t);
      const m = Math.min(RUN_LEN, elapsed), mm = String(Math.floor(m / 60)).padStart(2, "0"),
        ss = String(Math.floor(m % 60)).padStart(2, "0");
      $("timer").textContent = mm + ":" + ss;
      $("score").textContent = score;
      $("depth").textContent = depth;
      $("kills").textContent = kills;
      $("fuelFill").style.width = (fuel / fuelMax * 100) + "%";
      $("hpFill").style.width = (Math.max(0, hp) / maxHp * 100) + "%";
      $("xpFill").style.width = (xp / xpNeed * 100) + "%";
      $("dustRun").textContent = dustRun;
      $("dustMult").textContent = (depthMult() * comboMult()).toFixed(2);
      $("lv").textContent = level;
      requestAnimationFrame(loop);
    }
    $("backBtn").onclick = () => { location.href = "../index.html#games"; };
    $("muteBtn").onclick = toggleMute;
    $("pauseBtn").onclick = showPause;
    addEventListener("keydown", e => {
      if (e.key === "Escape" || e.key === "p" || e.key === "P") {
        if (paused) hidePause(); else showPause();
      }
    });
    $("best").textContent = (best ? ("最高纪录 " + best + " ｜ ") : "") + (bestDepth > 1 ? ("最深 " + bestDepth + "层") : "");
    reset(); state = "title";
    showTitle();
    requestAnimationFrame(loop);
  </script>
</body>

</html>
