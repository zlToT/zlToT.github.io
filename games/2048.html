<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>2048 · zlToT 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(160deg, #0a0c10 0%, #101613 50%, #0a0c10 100%);
    background-attachment: fixed;
    color: #e6ede9;
    padding: 24px 16px 48px;
  }
  .title-bar {
    text-align: center;
    width: 100%;
    max-width: 500px;
    margin-bottom: 18px;
  }
  h1 { font-size: 26px; font-weight: 800; color: #e6ede9; }
  .bottom-bar { display: flex; justify-content: center; margin-top: 16px; }
  .back-btn {
    padding: 10px 26px;
    border: none;
    border-radius: 60px;
    background: #facc15;
    color: #1a1c2c;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform .15s, box-shadow .15s;
  }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(250,204,21,.3); }
  .hud {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 16px;
    width: 100%;
    max-width: 500px;
  }
  .hud-item {
    background: rgba(15,25,32,0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    flex: 1;
  }
  .hud-label { font-size: 12px; color: #809aa8; }
  .hud-value { font-size: 20px; font-weight: 800; color: #e6ede9; }
  .hud-item small { font-size: 12px; font-weight: 500; color: #809aa8; margin-left: 4px; }
  .board-wrap {
    position: relative;
    background: rgba(15,25,32,0.6);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 500px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    background: #131b16;
    border-radius: 14px;
    padding: 10px;
  }
  .cell {
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 24px;
    background: rgba(255,255,255,0.04);
    color: #3a5547;
    transition: background 0.12s ease;
  }
  .cell.t2 { background: #dce9df; color: #e6ede9; }
  .cell.t4 { background: #d3f3e0; color: #e6ede9; }
  .cell.t8 { background: #b5e0cc; color: #e6ede9; }
  .cell.t16 { background: #8fd0b5; color: #e6ede9; }
  .cell.t32 { background: #57b68c; color: #e6ede9; }
  .cell.t64 { background: #57b68c; color: #0a1e14; }
  .cell.t128 { background: #2f855a; color: #fff; }
  .cell.t256 { background: #f59e0b; color: #1a1c2c; }
  .cell.t512 { background: #f97316; color: #fff; }
  .cell.t1024 { background: #ea580c; color: #fff; }
  .cell.t2048 { background: #facc15; color: #1a1c2c; }
  .cell.big { font-size: 18px; }
  @keyframes tilePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .cell.pop { animation: tilePop 0.18s ease; }
  .overlay {
    position: absolute;
    inset: 14px;
    border-radius: 14px;
    background: rgba(10, 15, 12, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; font-weight: 800; color: #e6ede9; }
  .overlay p { color: #3a5547; font-size: 15px; }
  .btn {
    padding: 12px 26px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #1a1c2c;
    background: #facc15;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .tip { margin-top: 16px; font-size: 13px; color: #809aa8; text-align: center; }
  /* 背景：漂浮数字，数字世界 */
  #numBg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #numBg span {
    position: absolute;
    bottom: -12%;
    font-weight: 800;
    font-family: "Courier New", monospace;
    opacity: 0;
    text-shadow: 0 0 18px currentColor;
    animation: numFloat linear infinite;
  }
  @keyframes numFloat {
    0% { transform: translateY(0) rotate(-8deg); opacity: 0; }
    12% { opacity: .32; }
    88% { opacity: .26; }
    100% { transform: translateY(-118vh) rotate(10deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div id="numBg" aria-hidden="true"></div>

  <div class="title-bar">
    <h1>🎮 2048</h1>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="hud-label">🏆 得分</div><div class="hud-value" id="score">0</div></div>
    <div class="hud-item"><div class="hud-label">💎 最高分</div><div class="hud-value" id="best">0</div></div>
    <div class="hud-item"><div class="hud-label">⭐ 最大</div><div class="hud-value" id="max">0</div></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">🎮 2048</h2>
      <p id="ov-desc">滑动合并相同的数字，向 2048 发起挑战！</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="back-btn" onclick="history.back()">⬅ 返回</button>
  </div>

  <p class="tip">电脑用方向键，手机直接滑动屏幕</p>

<script>
(function () {
  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var maxEl = document.getElementById('max');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovDesc = document.getElementById('ov-desc');
  var startBtn = document.getElementById('startBtn');

  var SIZE = 4;
  var grid = [];
  var score = 0;
  var best = Number(localStorage.getItem('g2048-best') || 0);
  bestEl.textContent = best;

  var cells = [];
  for (var i = 0; i < SIZE * SIZE; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    boardEl.appendChild(c);
    cells.push(c);
  }

  function emptyCells() {
    var out = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!grid[r][c]) out.push([r, c]);
    return out;
  }

  function addTile() {
    var empty = emptyCells();
    if (!empty.length) return;
    var p = empty[Math.floor(Math.random() * empty.length)];
    grid[p[0]][p[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function newGame() {
    grid = [];
    for (var r = 0; r < SIZE; r++) {
      grid.push([]);
      for (var c = 0; c < SIZE; c++) grid[r].push(0);
    }
    score = 0;
    scoreEl.textContent = '0';
    addTile();
    addTile();
    render();
    overlay.classList.add('hidden');
  }

  function render() {
    var max = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c];
        var cell = cells[r * SIZE + c];
        cell.textContent = v || '';
        cell.className = 'cell' + (v ? ' t' + v : '') + (v >= 128 ? ' big' : '');
        if (v > max) max = v;
      }
    }
    maxEl.textContent = max;
    scoreEl.textContent = score;
  }

  function mergeLine(line) {
    var arr = line.filter(function (v) { return v !== 0; });
    var out = [];
    var added = 0;
    for (var i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
        out.push(arr[i] * 2);
        added += arr[i] * 2;
        i++;
      } else {
        out.push(arr[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { line: out, added: added };
  }

  function move(dir) {
    var moved = false;
    var gained = 0;
    for (var i = 0; i < SIZE; i++) {
      var line = [], pos = [];
      for (var j = 0; j < SIZE; j++) {
        var r, c;
        if (dir === 'left') { r = i; c = j; }
        else if (dir === 'right') { r = i; c = SIZE - 1 - j; }
        else if (dir === 'up') { r = j; c = i; }
        else { r = SIZE - 1 - j; c = i; }
        line.push(grid[r][c]);
        pos.push([r, c]);
      }
      var res = mergeLine(line);
      gained += res.added;
      for (var k = 0; k < SIZE; k++) {
        var pr = pos[k][0], pc = pos[k][1];
        if (grid[pr][pc] !== res.line[k]) moved = true;
        grid[pr][pc] = res.line[k];
      }
    }
    if (moved) {
      score += gained;
      if (score > best) {
        best = score;
        localStorage.setItem('g2048-best', best);
      }
      bestEl.textContent = best;
      if (gained > 0 && window.SFX) window.SFX.merge();
      addTile();
      render();
      // 移动/合并弹跳特效
      for (var i = 0; i < SIZE * SIZE; i++) {
        if (cells[i].textContent !== '') cells[i].classList.add('pop');
      }
      setTimeout(function () {
        for (var j = 0; j < SIZE * SIZE; j++) cells[j].classList.remove('pop');
      }, 200);
      if (isOver()) gameOver();
    }
  }

  function isOver() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return false;
        if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return false;
        if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return false;
      }
    }
    return true;
  }

  function gameOver() {
    ovTitle.textContent = '🎮 游戏结束';
    ovDesc.textContent = '最终得分 ' + score + (score >= best && score > 0 ? '，刷新纪录！' : '');
    startBtn.textContent = '再来一局';
    if (window.SFX) window.SFX.over();
    overlay.classList.remove('hidden');
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft') { e.preventDefault(); move('left'); }
    else if (k === 'ArrowRight') { e.preventDefault(); move('right'); }
    else if (k === 'ArrowUp') { e.preventDefault(); move('up'); }
    else if (k === 'ArrowDown') { e.preventDefault(); move('down'); }
  });

  // 触摸滑动
  var tx = null, ty = null;
  boardEl.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    tx = null; ty = null;
  });

  // 初始：空棋盘 + 玩法说明，点击「开始游戏」后开局
  grid = [];
  for (var r = 0; r < SIZE; r++) {
    grid.push([]);
    for (var c = 0; c < SIZE; c++) grid[r].push(0);
  }
  ovTitle.textContent = '🎮 2048 怎么玩';
  ovDesc.innerHTML = '用方向键（手机滑动）移动所有数字。<br>相同的数字相撞会合并翻倍：<b>2+2=4</b> → <b>4+4=8</b> → …<br>目标：一路合成出 <b>2048</b>！';
  startBtn.textContent = '开始游戏';
  startBtn.addEventListener('click', newGame);
  render();
})();
</script>

<script src="common.js"></script>
<script>
// 背景漂浮数字（数字世界）
(function () {
  var bg = document.getElementById('numBg');
  var vals = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048];
  var colors = ['#dce9df', '#d3f3e0', '#b5e0cc', '#8fd0b5', '#57b68c', '#2f855a', '#f59e0b', '#f97316', '#ea580c', '#facc15'];
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('span');
    s.textContent = vals[Math.floor(Math.random() * vals.length)];
    s.style.left = (Math.random() * 88 + 2) + '%';
    s.style.fontSize = (Math.random() * 32 + 28) + 'px';
    s.style.color = colors[Math.floor(Math.random() * colors.length)];
    s.style.animationDuration = (Math.random() * 10 + 12) + 's';
    s.style.animationDelay = (-Math.random() * 16) + 's';
    bg.appendChild(s);
  }
})();
</script>
</body>
</html>
