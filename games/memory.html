<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>记忆翻牌 · zlToT 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(160deg, #0a0c10 0%, #101613 50%, #0a0c10 100%);
    background-attachment: fixed;
    color: #e6ede9;
    padding: 24px 16px 48px;
  }
  .title-bar {
    text-align: center;
    width: 100%;
    max-width: 520px;
    margin-bottom: 18px;
  }
  h1 { font-size: 26px; font-weight: 800; color: #e6ede9; }
  .bottom-bar { display: flex; justify-content: center; margin-top: 16px; }
  .back-btn {
    padding: 10px 26px;
    border: none;
    border-radius: 60px;
    background: #facc15;
    color: #1a1c2c;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform .15s, box-shadow .15s;
  }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(250,204,21,.3); }
  .hud { display: flex; gap: 14px; justify-content: center; margin-bottom: 16px; width: 100%; max-width: 520px; }
  .hud-item {
    background: rgba(15,25,32,0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    flex: 1;
  }
  .hud-label { font-size: 12px; color: #809aa8; }
  .hud-value { font-size: 20px; font-weight: 800; color: #e6ede9; }
  .board-wrap {
    position: relative;
    background: rgba(15,25,32,0.6);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 520px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
  }
  .card {
    position: relative;
    border-radius: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    perspective: 600px;
    transform-style: preserve-3d;
  }
  .card-inner {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    transition: transform 0.4s ease;
    transform-style: preserve-3d;
  }
  .card.flip .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.back {
    background: linear-gradient(135deg, #57b68c, #2f855a);
    color: #fff;
    font-weight: 800;
    font-size: 22px;
    box-shadow: 0 4px 12px rgba(34,197,94,0.25);
  }
  .face.back:hover { filter: brightness(1.06); }
  .face.front {
    background: #131b16;
    color: #e6ede9;
    transform: rotateY(180deg);
    box-shadow: inset 0 0 0 1.5px rgba(34,197,94,0.25);
  }
  .face.front svg { width: 52%; height: 52%; }
  .card.matched .face.front {
    background: #1e4a2f;
    color: #7fd4a8;
    box-shadow: inset 0 0 0 1.5px rgba(87,182,140,0.3);
    cursor: default;
  }
  .card.matched .card-inner { transform: rotateY(180deg); }
  .overlay {
    position: absolute;
    inset: 14px;
    border-radius: 14px;
    background: rgba(10, 15, 12, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; font-weight: 800; color: #e6ede9; }
  .overlay p { color: #aad0e6; font-size: 15px; }
  .btn {
    padding: 12px 26px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #1a1c2c;
    background: #facc15;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .tip { margin-top: 16px; font-size: 13px; color: #809aa8; text-align: center; }
  /* 背景：右侧浅色月亮 + 星 */
  #moon { position: fixed; top: 7vh; right: 9vw; width: 92px; height: 92px; z-index: 0; pointer-events: none; }
  #moon .body {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fffdf0, #fdf3c8 62%, #f0e3ae);
    box-shadow: 0 0 42px rgba(253,243,200,.6), 0 0 120px rgba(253,243,200,.28);
  }
  #moon .crater { position: absolute; border-radius: 50%; background: rgba(224,205,150,.45); }
  #moon .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fffbe0; opacity: .75; box-shadow: 0 0 8px #fffbe0; }
  /* 背景：上方随机星星闪烁 */
  #bgStars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #bgStars span {
    position: absolute;
    color: #fffbe0;
    opacity: 0.15;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.85); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }
  /* 配对成功闪光 */
  @keyframes matchGlow {
    0% { box-shadow: 0 0 0 rgba(127,212,168,0); }
    50% { box-shadow: 0 0 18px 4px rgba(127,212,168,0.55); }
    100% { box-shadow: 0 0 0 rgba(127,212,168,0); }
  }
  .card.matched .face.front { animation: matchGlow 0.6s ease; }
</style>
</head>
<body>
  <div id="moon" aria-hidden="true">
    <div class="body"></div>
    <div class="crater" style="width:18px;height:18px;left:20px;top:26px"></div>
    <div class="crater" style="width:12px;height:12px;left:52px;top:44px"></div>
    <div class="crater" style="width:9px;height:9px;left:40px;top:16px"></div>
    <div class="star" style="left:120px;top:-12px"></div>
    <div class="star" style="left:-42px;top:30px;width:2px;height:2px"></div>
    <div class="star" style="left:66px;top:-44px;width:2px;height:2px"></div>
    <div class="star" style="left:120px;top:70px;width:2px;height:2px"></div>
  </div>

  <div id="bgStars" aria-hidden="true"></div>

  <div class="title-bar">
    <h1>🧠 记忆翻牌</h1>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="hud-label">👣 步数</div><div class="hud-value" id="steps">0</div></div>
    <div class="hud-item"><div class="hud-label">🃏 已配对</div><div class="hud-value" id="pairs">0 / 8</div></div>
    <div class="hud-item"><div class="hud-label">🏆 最佳</div><div class="hud-value" id="best">—</div></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">🧠 记忆翻牌</h2>
      <p id="ov-desc">翻开两张卡片，找出所有相同的图案！</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="back-btn" onclick="history.back()">⬅ 返回</button>
  </div>

  <p class="tip">看看你最少能用多少步完成配对</p>

<script>
(function () {
  // 8 种图案（内联 SVG，颜色随 CSS currentColor）
  var SHAPES = [
    '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 22 20H2Z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.4 5.2 5.6.7-4.1 3.9 1 5.6-4.9-2.7-4.9 2.7 1-5.6L4.1 8.9l5.6-.7L12 3Z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.4 5.4 5.4 0 0 1 21.3 12C19 16.4 12 21 12 21Z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 3v7h4V3h3v7h4v4h-4v7h-3v-7h-4v7H7v-7H3v-4h4V3Z"/></svg>',
  ];

  var boardEl = document.getElementById('board');
  var stepsEl = document.getElementById('steps');
  var pairsEl = document.getElementById('pairs');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovDesc = document.getElementById('ov-desc');
  var startBtn = document.getElementById('startBtn');

  var best = localStorage.getItem('memory-best');
  bestEl.textContent = best ? best + ' 步' : '—';

  var cards = [];
  var flipped = [];
  var matchedCount = 0;
  var steps = 0;
  var locked = false;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function build() {
    // 8 对 × 2 = 16 张
    var deck = [];
    for (var i = 0; i < SHAPES.length; i++) {
      deck.push(i, i);
    }
    deck = shuffle(deck);
    cards = [];
    flipped = [];
    matchedCount = 0;
    steps = 0;
    locked = false;
    stepsEl.textContent = 0;
    pairsEl.textContent = '0 / 8';

    var html = '';
    deck.forEach(function (shapeIdx) {
      html +=
        '<div class="card" data-shape="' + shapeIdx + '">' +
          '<div class="card-inner">' +
            '<div class="face back">?</div>' +
            '<div class="face front">' + SHAPES[shapeIdx] + '</div>' +
          '</div>' +
        '</div>';
    });
    boardEl.innerHTML = html;
    cards = Array.prototype.slice.call(boardEl.querySelectorAll('.card'));
    cards.forEach(function (card) {
      card.addEventListener('click', function () { flip(card); });
    });
  }

  function flip(card) {
    if (locked) return;
    if (card.classList.contains('flip')) return;
    if (card.classList.contains('matched')) return;
    if (flipped.length >= 2) return;

    card.classList.add('flip');
    flipped.push(card);

    if (flipped.length === 2) {
      steps++;
      stepsEl.textContent = steps;
      if (window.SFX) window.SFX.flip();
      var a = Number(flipped[0].dataset.shape);
      var b = Number(flipped[1].dataset.shape);
      if (a === b) {
        matchedCount++;
        pairsEl.textContent = matchedCount + ' / 8';
        flipped.forEach(function (c) { c.classList.add('matched'); });
        if (window.SFX) window.SFX.match();
        flipped = [];
        if (matchedCount === 8) win();
      } else {
        locked = true;
        setTimeout(function () {
          flipped.forEach(function (c) { c.classList.remove('flip'); });
          flipped = [];
          locked = false;
        }, 800);
      }
    }
  }

  function win() {
    overlay.classList.remove('hidden');
    ovTitle.textContent = '全部配对完成！';
    ovDesc.textContent = '你用了 ' + steps + ' 步完成挑战';
    if (!best || steps < Number(best)) {
      best = String(steps);
      localStorage.setItem('memory-best', best);
      bestEl.textContent = best + ' 步';
      ovDesc.textContent += '，创造了新纪录！';
    }
    startBtn.textContent = '再来一局';
  }

  startBtn.addEventListener('click', function () {
    build();
    overlay.classList.add('hidden');
  });

  // 背景星星（上方随机闪烁）
  (function () {
    var bg = document.getElementById('bgStars');
    if (!bg) return;
    var stars = ['⭐', '✨', '✦', '·'];
    for (var i = 0; i < 16; i++) {
      var s = document.createElement('span');
      s.textContent = stars[Math.floor(Math.random() * stars.length)];
      s.style.left = (Math.random() * 94 + 2) + '%';
      s.style.top = (Math.random() * 30 + 2) + '%';
      s.style.fontSize = (Math.random() * 10 + 8) + 'px';
      s.style.animationDuration = (Math.random() * 2.5 + 1.5) + 's';
      s.style.animationDelay = (-Math.random() * 4) + 's';
      bg.appendChild(s);
    }
  })();

  build();
})();
</script>

<script src="common.js"></script>
</body>
</html>
