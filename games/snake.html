<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇｜手机/电脑</title>
  <style>
    * {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui;
    }

    .game-container {
      background: #0f1920;
      padding: 20px;
      border-radius: 42px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
      transform-origin: center center;
      flex-shrink: 0;
    }

    canvas {
      background-color: #1e2f3a;
      display: block;
      margin: 0 auto;
      border-radius: 20px;
      width: 100%;
      height: auto;
      max-width: 400px;
      touch-action: none;
      /* 禁止触摸滚动 */
    }

    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      background: #071016;
      padding: 12px 24px;
      border-radius: 60px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .score-box {
      background: #00000066;
      padding: 5px 16px;
      border-radius: 60px;
      color: #facc15;
      font-weight: bold;
      font-size: 1.5rem;
    }

    button {
      background: #facc15;
      border: none;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 60px;
      cursor: pointer;
      font-size: 1rem;
    }

    .direction-panel {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .dir-btn {
      background: #2d3e4e;
      border: none;
      font-size: 28px;
      padding: 8px 20px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px black;
      transition: 0.1s;
    }

    .dir-btn:active {
      transform: scale(0.95);
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    /* 背景：随机浮动水果（渐入渐出） */
    #bgFruits {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #bgFruits span {
      position: absolute;
      font-size: 34px;
      opacity: 0;
      animation: fruitFloat linear infinite;
    }

    @keyframes fruitFloat {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.85) rotate(-8deg);
      }

      25% {
        opacity: 0.22;
      }

      75% {
        opacity: 0.18;
      }

      100% {
        opacity: 0;
        transform: translateY(-36px) scale(1.05) rotate(8deg);
      }
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 22px;
      border-radius: 60px;
      background: #facc15;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      color: #1a1c2c;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.3);
    }

    @media (max-width: 500px) {
      .dir-btn {
        font-size: 24px;
        padding: 6px 16px;
      }

      .score-box {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div id="bgFruits" aria-hidden="true"></div>

  <div>
    <div class="game-container">
      <canvas id="snakeCanvas" width="400" height="400"></canvas>
      <div class="info-panel">
        <div class="score-box">🍎 <span id="scoreDisplay">0</span></div>
        <div class="score-box">🏆 <span id="bestDisplay">0</span></div>
        <button id="resetSnakeBtn">🐍 新的一局</button>
      </div>
      <div class="direction-panel">
        <button class="dir-btn" id="btnUp">⬆️</button>
        <button class="dir-btn" id="btnLeft">⬅️</button>
        <button class="dir-btn" id="btnDown">⬇️</button>
        <button class="dir-btn" id="btnRight">➡️</button>
      </div>
      <p style="text-align:center; color:#809aa8; margin-top:10px; font-size:12px;">键盘方向键 / 点击按钮 / 在地图上滑动手指</p>
    </div>
    <div class="bottom-bar">
      <button class="back-btn" onclick="history.back()">⬅ 返回</button>
    </div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('snakeCanvas');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('scoreDisplay');
      var bestEl = document.getElementById('bestDisplay');
      var resetBtn = document.getElementById('resetSnakeBtn');

      var GRID = 20;
      var CELL = canvas.width / GRID;

      var snake, dir, nextDir, food, score, timerId, running;
      var best = Number(localStorage.getItem('snake-best') || 0);
      var particles = [];

      function spawnBurst(x, y) {
        var colors = ['#7dd956', '#facc15', '#57b68c', '#ffffff'];
        for (var i = 0; i < 10; i++) {
          var ang = Math.random() * Math.PI * 2;
          var sp = Math.random() * 2.2 + 0.8;
          particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp - 0.5,
            life: 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            r: Math.random() * 2.4 + 1.4
          });
        }
      }

      function init() {
        snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = '0';
        placeFood();
      }

      function placeFood() {
        while (true) {
          food = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID)
          };
          var hit = snake.some(function (s) { return s.x === food.x && s.y === food.y; });
          if (!hit) break;
        }
      }

      function start() {
        clearInterval(timerId);
        init();
        running = true;
        timerId = setInterval(tick, 150);
        draw();
      }

      function tick() {
        dir = nextDir;
        var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) { gameOver(); return; }
        var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
        if (hitSelf) { gameOver(); return; }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score++;
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            localStorage.setItem('snake-best', best);
            bestEl.textContent = best;
          }
          if (window.SFX) window.SFX.eat();
          spawnBurst(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2);
          placeFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function gameOver() {
        running = false;
        clearInterval(timerId);
        if (window.SFX) window.SFX.over();
        draw();
        ctx.fillStyle = 'rgba(0,0,0,0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 26px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = '15px "Segoe UI"';
        ctx.fillStyle = '#aad0e6';
        ctx.fillText('得分 ' + score + ' · 点击「新的一局」再来', canvas.width / 2, canvas.height / 2 + 26);
        ctx.textAlign = 'start';
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 网格（淡）
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (var i = 0; i <= GRID; i++) {
          ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
        }

        // 食物（苹果 🍎）
        ctx.font = (CELL - 2) + 'px "Segoe UI", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍎', food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);

        // 蛇（头亮绿带眼睛，身深绿，圆角）
        for (var j = 0; j < snake.length; j++) {
          var s = snake[j];
          if (j === 0) {
            ctx.fillStyle = '#7dd956';
            roundRect(ctx, s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
            // 眼睛朝向移动方向
            var cx = s.x * CELL + CELL / 2, cy = s.y * CELL + CELL / 2;
            var px = -dir.y, py = dir.x;
            drawEye(cx + dir.x * 3.5 + px * 3, cy + dir.y * 3.5 + py * 3);
            drawEye(cx + dir.x * 3.5 - px * 3, cy + dir.y * 3.5 - py * 3);
          } else {
            ctx.fillStyle = '#58b13a';
            roundRect(ctx, s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
          }
        }

        // 粒子特效（吃到水果的迸发）
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.vy += 0.06;
          pt.life -= 0.03;
          if (pt.life <= 0) { particles.splice(p, 1); continue; }
          ctx.globalAlpha = pt.life > 0 ? pt.life : 0;
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
        c.fill();
      }

      function drawEye(x, y) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1c2c';
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      function setDir(dx, dy) {
        if (dx === -dir.x && dy === -dir.y) return;
        nextDir = { x: dx, y: dy };
      }

      // 触摸滑动控制方向（在地图区域上手指滑动即可转向）
      var touchStartX = 0, touchStartY = 0, touching = false;
      var SWIPE_THRESHOLD = 24; // 触发转向的最小滑动像素

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        touching = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchmove', function (e) {
        if (!touching || e.touches.length !== 1) return;
        var dx = e.touches[0].clientX - touchStartX;
        var dy = e.touches[0].clientY - touchStartY;
        var absX = Math.abs(dx), absY = Math.abs(dy);
        if (Math.max(absX, absY) < SWIPE_THRESHOLD) return;
        if (absX > absY) {
          setDir(dx > 0 ? 1 : -1, 0);
        } else {
          setDir(0, dy > 0 ? 1 : -1);
        }
        // 更新起点，支持一次滑动中连续转弯
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchend', function () {
        touching = false;
      });

      document.addEventListener('keydown', function (e) {
        var k = e.key;
        if (k === 'ArrowUp' || k.toUpperCase() === "W") { e.preventDefault(); setDir(0, -1); }
        else if (k === 'ArrowDown' || k.toUpperCase() === "S") { e.preventDefault(); setDir(0, 1); }
        else if (k === 'ArrowLeft' || k.toUpperCase() === "A") { e.preventDefault(); setDir(-1, 0); }
        else if (k === 'ArrowRight' || k.toUpperCase() === "D") { e.preventDefault(); setDir(1, 0); }
      });

      document.getElementById('btnUp').addEventListener('click', function () { setDir(0, -1); });
      document.getElementById('btnLeft').addEventListener('click', function () { setDir(-1, 0); });
      document.getElementById('btnDown').addEventListener('click', function () { setDir(0, 1); });
      document.getElementById('btnRight').addEventListener('click', function () { setDir(1, 0); });

      resetBtn.addEventListener('click', start);

      bestEl.textContent = best;

      // 背景浮动水果（渐入渐出）
      (function () {
        var bg = document.getElementById('bgFruits');
        if (!bg) return;
        var fruits = ['🍎', '🍌', '🍇', '🍊', '🍓', '🍉'];
        for (var i = 0; i < 7; i++) {
          var s = document.createElement('span');
          s.textContent = fruits[Math.floor(Math.random() * fruits.length)];
          s.style.left = (Math.random() * 90 + 2) + '%';
          s.style.top = (Math.random() * 88 + 4) + '%';
          s.style.fontSize = (Math.random() * 18 + 24) + 'px';
          s.style.animationDuration = (Math.random() * 5 + 4) + 's';
          s.style.animationDelay = (-Math.random() * 8) + 's';
          bg.appendChild(s);
        }
      })();

      // 加载即开始
      start();
    })();
  </script>

  <script type="module">
  import { fitToScreen } from './game-utils.js';
  fitToScreen('.game-container');
</script>
<script src="common.js"></script>
</body>

</html>
